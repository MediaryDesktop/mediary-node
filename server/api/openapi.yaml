            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MangaLinksOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Series a title is read from
      tags:
        - manga
  /v1/manga/titles/{mediaRef}/links/{source}:
    delete:
      operationId: deleteMangaLink
      parameters:
        - in: path
          name: mediaRef
          required: true
          schema:
            type: string
