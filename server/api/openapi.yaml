components:
  schemas:
    AIKeyUpdate:
      additionalProperties: false
      properties:
        api_key:
          description: The user's own key. The provider is asked to accept it before it is stored. Empty forgets it; left out keeps the one stored.
          maxLength: 1024
          type: string
        model:
          description: The model to answer with. Left out keeps the one chosen.
          maxLength: 200
          type: string
      type: object
    AISettings:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AISettings.json
          format: uri
          readOnly: true
          type: string
        claude:
          $ref: "#/components/schemas/KeyedAISettings"
        cloud:
          $ref: "#/components/schemas/CloudAISettings"
        gemini:
          $ref: "#/components/schemas/KeyedAISettings"
        openai:
          $ref: "#/components/schemas/OpenAISettings"
        provider:
          description: The AI that answers. cloud is Mediary's free AI, on the cloud's key within a daily allowance; the others use the user's own key.
          enum:
            - cloud
            - claude
            - gemini
            - openai
          type: string
        ready:
          description: Whether the chosen AI can answer right now.
          type: boolean
      required:
        - provider
        - ready
        - cloud
        - claude
        - gemini
        - openai
      type: object
    AISettingsUpdate:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AISettingsUpdate.json
          format: uri
          readOnly: true
          type: string
        claude:
          $ref: "#/components/schemas/AIKeyUpdate"
        gemini:
          $ref: "#/components/schemas/AIKeyUpdate"
        openai:
          $ref: "#/components/schemas/OpenAIUpdate"
        provider:
          description: The AI to answer with. Choosing one that is not set up yet is allowed; ready says so.
          enum:
            - cloud
            - claude
            - gemini
            - openai
          type: string
      type: object
    AcceptedOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AcceptedOutputBody.json
          format: uri
          readOnly: true
          type: string
        accepted:
          description: The refresh was started or is already running.
          type: boolean
      required:
        - accepted
      type: object
    Account:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Account.json
          format: uri
          readOnly: true
          type: string
        avatar_url:
          type:
            - string
            - "null"
        display_adult_content:
          type: boolean
        id:
          format: int64
          type: integer
        name:
          type: string
        score_format:
          type: string
        site_url:
          type: string
      required:
        - id
        - name
        - site_url
        - avatar_url
        - score_format
        - display_adult_content
      type: object
    AddRepositoryInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AddRepositoryInputBody.json
          format: uri
          readOnly: true
          type: string
        url:
          description: The repository's JSON, at an https:// address.
          format: uri
          maxLength: 2048
          type: string
      required:
        - url
      type: object
    AddRootInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AddRootInputBody.json
          format: uri
          readOnly: true
          type: string
        content:
          description: What the folder holds, as in listLibraryRoots. Left out means anime.
          enum:
            - anime
            - movies_and_shows
            - doramas
            - manga
            - books
          type: string
        path:
          description: Absolute path to an existing folder on this machine.
          examples:
            - D:\Anime
          maxLength: 4096
          minLength: 1
          type: string
      required:
        - path
      type: object
    AddTorrentDownloadInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AddTorrentDownloadInputBody.json
          format: uri
          readOnly: true
          type: string
        choose_files:
          description: Hold the torrent in the client until its files are chosen with PUT .../files.
          type: boolean
        episodes:
          description: The episodes the download is for. With choose_files, the node itself takes only their files once the file list arrives.
          items:
            format: int64
            type: integer
          maxItems: 2000
          type:
            - array
            - "null"
        magnet:
          description: A magnet link with a BitTorrent v1 hash. Give this or torrent.
          maxLength: 65536
          type: string
        media_ref:
          description: The title the download is for; its files are matched to it.
          minLength: 1
          type: string
        release_id:
          description: A search result to download. Give this, magnet or torrent.
          maxLength: 100
          type: string
        title:
          description: The title's name, which names the folder the torrent is saved into.
          maxLength: 500
          type: string
        torrent:
          contentEncoding: base64
          description: A .torrent file, base64-encoded. Give this or magnet.
          type: string
      required:
        - media_ref
      type: object
    AiringEpisode:
      additionalProperties: false
      properties:
        airing_at:
          format: date-time
          type: string
        episode:
          format: int64
          type: integer
        season:
          description: Season the episode belongs to, for a show numbered by season. Absent for an anime, whose seasons are titles of their own.
          format: int64
          type: integer
      required:
        - episode
        - airing_at
      type: object
    Audio:
      additionalProperties: false
      properties:
        channels:
          format: int32
          minimum: 0
          type: integer
        codec:
          type: string
        index:
          format: int32
          minimum: 0
          type: integer
        is_default:
          type: boolean
        is_forced:
          type: boolean
        language:
          type: string
        mime_codec:
          type: string
        title:
          type: string
      required:
        - index
        - codec
        - is_default
        - is_forced
        - channels
      type: object
    BookDownload:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BookDownload.json
          format: uri
          readOnly: true
          type: string
        authors:
          type: string
        bytes_done:
          format: int64
          type: integer
        bytes_total:
          description: 0 while the size is unknown.
          format: int64
          type: integer
        edition_ref:
          type: string
        error:
          type: string
        file_id:
          description: The library file, once the book is saved; open it in the reader.
          format: int64
          type: integer
        format:
          type: string
        id:
          format: int64
          type: integer
        media_ref:
          type: string
        rel_path:
          description: Where the book is saved, inside the folder for books.
          type: string
        source_name:
          type: string
        state:
          enum:
            - queued
            - running
            - done
            - failed
            - cancelled
          type: string
        title:
          type: string
      required:
        - id
        - edition_ref
        - format
        - media_ref
        - title
        - source_name
        - state
        - bytes_done
        - bytes_total
      type: object
    BookDownloadSettings:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BookDownloadSettings.json
          format: uri
          readOnly: true
          type: string
        root_id:
          description: Library folder of books copies are saved to; 0 while none is chosen.
          format: int64
          type: integer
      required:
        - root_id
      type: object
    BookDownloadsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BookDownloadsOutputBody.json
          format: uri
          readOnly: true
          type: string
        downloads:
          items:
            $ref: "#/components/schemas/BookDownload"
          type:
            - array
            - "null"
      required:
        - downloads
      type: object
    BookEdition:
      additionalProperties: false
      properties:
        authors:
          items:
            type: string
          type:
            - array
            - "null"
        formats:
          description: Only the formats the library keeps.
          items:
            $ref: "#/components/schemas/BookFormat"
          type:
            - array
            - "null"
        language:
          type: string
        ref:
          description: Pass as edition_ref to download it, within 30 minutes of the search.
          examples:
            - gutenberg:84
          type: string
        source:
          description: The source's name.
          type: string
        title:
          type: string
        year:
          format: int64
          type: integer
      required:
        - ref
        - title
        - authors
        - source
        - formats
      type: object
    BookFormat:
      additionalProperties: false
      properties:
        ext:
          examples:
            - .epub
          type: string
        size:
          description: Bytes, when the source says.
          format: int64
          type: integer
        type:
          description: Pass as format to download the copy in it.
          examples:
            - application/epub+zip
          type: string
      required:
        - type
        - ext
      type: object
    BookInfo:
      additionalProperties: false
      properties:
        content_type:
          description: The type getReaderBook serves the bytes as, which picks the viewer.
          type: string
        file_id:
          description: Library file the book is.
          format: int64
          type: integer
        media_ref:
          description: Title the book is matched to; absent while unmatched, and then reading moves no list.
          type: string
        title:
          description: The book's name as the library knows it.
          type: string
      required:
        - file_id
        - title
        - content_type
      type: object
    BookOPDSServerBody:
      additionalProperties: false
      properties:
        has_password:
          description: Whether a password is stored. The password itself is never sent back.
          type: boolean
        id:
          format: int64
          type: integer
        name:
          type: string
        url:
          description: Address of the catalogue's root feed.
          type: string
        username:
          type: string
      required:
        - id
        - name
        - url
        - has_password
      type: object
    BookOPDSServerInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BookOPDSServerInputBody.json
          format: uri
          readOnly: true
          type: string
        name:
          maxLength: 100
          type: string
        password:
          description: Absent keeps the stored password; an empty string removes it.
          maxLength: 500
          type: string
        url:
          description: "Address of the catalogue's root feed: http://nas:8083/opds for Calibre-Web, https://standardebooks.org/feeds/opds for Standard Ebooks."
          maxLength: 2000
          type: string
        username:
          description: For Standard Ebooks, the e-mail of a Patrons Circle member, with no password.
          maxLength: 200
          type: string
      required:
        - name
        - url
      type: object
    BookOPDSServerOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BookOPDSServerOutputBody.json
          format: uri
          readOnly: true
          type: string
        server:
          $ref: "#/components/schemas/BookOPDSServerBody"
      required:
        - server
      type: object
    BookOPDSServersOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BookOPDSServersOutputBody.json
          format: uri
          readOnly: true
          type: string
        servers:
          items:
            $ref: "#/components/schemas/BookOPDSServerBody"
          type:
            - array
            - "null"
      required:
        - servers
      type: object
    BookPosition:
      additionalProperties: false
      properties:
        fraction:
          description: How far through the book that is, from 0 to 1.
          format: double
          maximum: 1
          minimum: 0
          type: number
        locator:
          description: "Where the reader is, in the renderer's own terms: an EPUB CFI, or a PDF page."
          type: string
        updated_at:
          description: When the reader was last there.
          format: date-time
          type: string
      required:
        - locator
        - fraction
        - updated_at
      type: object
    BookPositionInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BookPositionInputBody.json
          format: uri
          readOnly: true
          type: string
        fraction:
          description: How far through the book that is, from 0 to 1.
          format: double
          maximum: 1
          minimum: 0
          type: number
        locator:
          description: Where the reader is, in the renderer's own terms.
          maxLength: 4096
          minLength: 1
          type: string
      required:
        - locator
        - fraction
      type: object
    BookPositionOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BookPositionOutputBody.json
          format: uri
          readOnly: true
          type: string
        book:
          $ref: "#/components/schemas/BookInfo"
          description: The book being read.
        position:
          $ref: "#/components/schemas/BookPosition"
          description: Where the reader left the book; null for a book never opened.
      required:
        - book
        - position
      type: object
    BookSource:
      additionalProperties: false
      properties:
        id:
          description: The prefix of the source's edition references.
          examples:
            - gutenberg
          type: string
        name:
          examples:
            - Project Gutenberg
          type: string
      required:
        - id
        - name
      type: object
    BookSourceOutcome:
      additionalProperties: false
      properties:
        error:
          type: string
        id:
          type: string
        name:
          type: string
        results:
          format: int64
          type: integer
      required:
        - id
        - name
        - results
      type: object
    BookSourcesOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BookSourcesOutputBody.json
          format: uri
          readOnly: true
          type: string
        sources:
          description: The sources the node searches; empty while none is set up.
          items:
            $ref: "#/components/schemas/BookSource"
          type:
            - array
            - "null"
      required:
        - sources
      type: object
    CandidatesOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CandidatesOutputBody.json
          format: uri
          readOnly: true
          type: string
        images:
          description: Pictures that could be the poster, posters first. Nothing is downloaded until one is picked.
          items:
            $ref: "#/components/schemas/Image"
          type:
            - array
            - "null"
        sources:
          description: Where the pictures were found.
          items:
            $ref: "#/components/schemas/Source"
          type:
            - array
            - "null"
      required:
        - images
        - sources
      type: object
    CatalogPlugin:
      additionalProperties: false
      properties:
        author:
          type: string
        description:
          type: string
        icon:
          type: string
        id:
          type: string
        installed:
          description: The version installed under this plugin's id, if any.
          type: string
        installed_here:
          description: Installed from this very manifest address.
          type: boolean
        lang:
          type: string
        manifest_url:
          description: Preview and install from here.
          type: string
        name:
          type: string
        repository_id:
          format: int64
          type: integer
        repository_name:
          type: string
        type:
          enum:
            - torrent-provider
            - manga-provider
          type: string
        update:
          description: Installed from here, and the repository lists a newer version.
          type: boolean
        version:
          type: string
      required:
        - manifest_url
        - id
        - name
        - version
        - type
        - author
        - repository_id
        - repository_name
        - installed_here
        - update
      type: object
    Chapter:
      additionalProperties: false
      properties:
        end_time:
          format: float
          type: number
        name:
          type: string
        start_time:
          format: float
          type: number
      required:
        - start_time
        - end_time
        - name
      type: object
    ChapterBody:
      additionalProperties: false
      properties:
        file_id:
          description: Library file this chapter is. Absent for a chapter from any other source.
          format: int64
          type: integer
        groups:
          description: Who translated it, to credit them.
          items:
            type: string
          type:
            - array
            - "null"
        media_ref:
          description: Title this chapter is matched to. Absent while unmatched.
          type: string
        number:
          description: Chapter number as the source writes it, such as 12 or 12.5. Absent for an unnumbered chapter.
          type: string
        pages:
          description: Every page, in reading order.
          items:
            $ref: "#/components/schemas/Page"
          type:
            - array
            - "null"
        ref:
          description: Chapter reference, for the page and progress endpoints.
          type: string
        source_name:
          description: Where an online chapter comes from, to credit it.
          type: string
        title:
          description: Title as the source names it, for the UI.
          type: string
      required:
        - ref
        - title
        - pages
      type: object
    ChapterOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ChapterOutputBody.json
          format: uri
          readOnly: true
          type: string
        chapter:
          $ref: "#/components/schemas/ChapterBody"
      required:
        - chapter
      type: object
    CheckBookOPDSServerInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CheckBookOPDSServerInputBody.json
          format: uri
          readOnly: true
          type: string
        password:
          maxLength: 500
          type: string
        server_id:
          description: A saved server, whose stored password is used when none is given.
          format: int64
          type: integer
        url:
          maxLength: 2000
          type: string
        username:
          maxLength: 200
          type: string
      required:
        - url
      type: object
    CheckBookOPDSServerOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CheckBookOPDSServerOutputBody.json
          format: uri
          readOnly: true
          type: string
        detail:
          type: string
        ok:
          type: boolean
        problem:
          description: "What is wrong, when something is. no_search: the catalogue is listed but cannot be searched, so it takes no part in finding books."
          enum:
            - unauthorized
            - not_opds
            - no_search
            - unreachable
            - other_host
          type: string
      required:
        - ok
      type: object
    CheckOPDSServerInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CheckOPDSServerInputBody.json
          format: uri
          readOnly: true
          type: string
        password:
          type: string
        server_id:
          description: A saved server, whose stored password is used when none is given.
          format: int64
          type: integer
        url:
          type: string
        username:
          type: string
      required:
        - url
      type: object
    CheckOPDSServerOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CheckOPDSServerOutputBody.json
          format: uri
          readOnly: true
          type: string
        detail:
          type: string
        ok:
          type: boolean
        problem:
          description: What is wrong, when something is.
          enum:
            - unauthorized
            - not_opds
            - unreachable
            - other_host
          type: string
      required:
        - ok
      type: object
    CheckTorrentClientInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CheckTorrentClientInputBody.json
          format: uri
          readOnly: true
          type: string
        client:
          description: embedded checks the node's own client, debrid the debrid service's saved key; anything else, qBittorrent at url.
          enum:
            - ""
            - qbittorrent
            - embedded
            - debrid
          type: string
        password:
          description: Left out uses the saved password.
          maxLength: 1024
          type: string
        url:
          maxLength: 2048
          type: string
        username:
          maxLength: 256
          type: string
      required:
        - username
      type: object
    CheckTorrentDebridInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CheckTorrentDebridInputBody.json
          format: uri
          readOnly: true
          type: string
        api_key:
          description: A key to try; left out uses the saved one.
          maxLength: 256
          type: string
        service:
          enum:
            - torbox
            - realdebrid
            - alldebrid
            - premiumize
          type: string
      required:
        - service
      type: object
    CheckTorrentSourceInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CheckTorrentSourceInputBody.json
          format: uri
          readOnly: true
          type: string
        api_key:
          maxLength: 256
          type: string
        source_id:
          description: A saved source whose key to use when api_key is left out.
          format: int64
          type: integer
        url:
          maxLength: 2048
          minLength: 1
          type: string
      required:
        - url
      type: object
    CloudAISettings:
      additionalProperties: false
      properties:
        enabled:
          description: Whether the cloud offers AI at all.
          type: boolean
        known:
          description: Whether the cloud told the node its allowance. False when it is not paired or could not be reached.
          type: boolean
        limit:
          description: Requests per day.
          format: int64
          type: integer
        linked:
          description: Whether the node is paired with a Mediary Cloud account, which the free AI needs.
          type: boolean
        remaining:
          description: Requests left today.
          format: int64
          type: integer
        resets_at:
          description: When the allowance renews.
          format: date-time
          type: string
        used:
          description: Requests made today.
          format: int64
          type: integer
      required:
        - linked
        - known
        - enabled
        - limit
        - used
        - remaining
      type: object
    CollectionOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CollectionOutputBody.json
          format: uri
          readOnly: true
          type: string
        collection:
          $ref: "#/components/schemas/LibraryCollection"
          description: The library seen as titles rather than as files.
        sources:
          description: Attribution for every field that came from an external source.
          items:
            $ref: "#/components/schemas/Source"
          type:
            - array
            - "null"
      required:
        - collection
        - sources
      type: object
    ConfigureExtensionInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ConfigureExtensionInputBody.json
          format: uri
          readOnly: true
          type: string
        config:
          additionalProperties:
            type: string
          description: Only the settings to change. Empty goes back to the default; for a secret, removes it.
          type: object
        enabled:
          type: boolean
      type: object
    ControlInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ControlInputBody.json
          format: uri
          readOnly: true
          type: string
        action:
          description: What to do with the open player.
