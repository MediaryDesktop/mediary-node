          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Library module status
      tags:
        - library
  /v1/playback/status:
    get:
      description: Reports whether the playback module is wired. Placeholder for phase 0.
      operationId: getPlaybackStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOutputBody2"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Playback module status
      tags:
        - playback
  /v1/reader/status:
    get:
      description: Reports whether the reader module is wired. Placeholder for phase 0.
      operationId: getReaderStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOutputBody3"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Reader module status
      tags:
        - reader
  /v1/sync/status:
    get:
      description: Reports whether the sync module is wired. Placeholder for phase 0.
      operationId: getSyncStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOutputBody4"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Sync module status
      tags:
        - sync
  /v1/torrent/status:
    get:
      description: Reports whether the torrent module is wired. Placeholder for phase 0.
      operationId: getTorrentStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOutputBody1"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Torrent module status
      tags:
        - torrent
security:
  - nodeToken: []
tags:
  - description: Liveness and build information.
    name: health
  - description: Local file scanning and matching against catalog titles.
    name: library
  - description: Providers and download management.
    name: torrent
  - description: mpv control, direct play and transcoding.
    name: playback
  - description: Image-based and epub/pdf reading.
    name: reader
  - description: Progress synchronisation with a paired cloud account.
    name: sync
  - description: Plugin runtime for metadata and torrent providers.
    name: extension
