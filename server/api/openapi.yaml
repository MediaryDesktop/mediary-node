        - in: path
          name: source
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutMangaLinkInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Read a title from a series
      tags:
        - manga
  /v1/media/filter-options:
    get:
      description: The source's own vocabulary, kept for at most a day. Formats, statuses and seasons are fixed enums of searchMedia and are not repeated here.
      operationId: getMediaFilterOptions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilterOptionsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Genres and tags to filter by
      tags:
        - media
  /v1/media/search:
    get:
      description: "Asks the source that owns this kind of media, on demand and never in the background. Results are not stored: only a title the user opens is cached, and only for as long as the source's terms allow."
      operationId: searchMedia
      parameters:
        - description: Free text to match against every title the source knows. Empty browses by the filters alone.
          explode: false
          in: query
          name: q
          schema:
            description: Free text to match against every title the source knows. Empty browses by the filters alone.
            maxLength: 100
            type: string
        - description: Which catalog to search. Every source owns one kind of media, so this also picks the source.
          explode: false
          in: query
          name: type
          schema:
            default: anime
            description: Which catalog to search. Every source owns one kind of media, so this also picks the source.
            enum:
              - anime
              - manga
            type: string
        - description: Order of the results. Left out it means relevance while searching and popularity while browsing.
          explode: false
          in: query
          name: sort
          schema:
            description: Order of the results. Left out it means relevance while searching and popularity while browsing.
            enum:
              - SEARCH_MATCH
              - POPULARITY_DESC
              - TRENDING_DESC
              - SCORE_DESC
              - FAVOURITES_DESC
              - START_DATE_DESC
              - TITLE_ROMAJI
            type: string
        - description: Genres a title must all have, as listed by getMediaFilterOptions.
          explode: false
          in: query
          name: genres
          schema:
            description: Genres a title must all have, as listed by getMediaFilterOptions.
            items:
              type: string
            type:
              - array
              - "null"
        - description: Tags a title must all have, as listed by getMediaFilterOptions.
          explode: false
          in: query
          name: tags
          schema:
            description: Tags a title must all have, as listed by getMediaFilterOptions.
            items:
              type: string
            type:
              - array
              - "null"
        - description: Any of these formats.
          explode: false
          in: query
          name: formats
          schema:
            description: Any of these formats.
            items:
              enum:
                - TV
                - TV_SHORT
                - MOVIE
                - SPECIAL
                - OVA
                - ONA
                - MUSIC
                - MANGA
                - NOVEL
                - ONE_SHOT
              type: string
            type:
              - array
              - "null"
        - description: Any of these release statuses.
          explode: false
          in: query
          name: statuses
          schema:
            description: Any of these release statuses.
            items:
              enum:
                - FINISHED
                - RELEASING
                - NOT_YET_RELEASED
                - CANCELLED
                - HIATUS
              type: string
            type:
              - array
              - "null"
        - description: Season the title started in.
          explode: false
          in: query
          name: season
          schema:
            description: Season the title started in.
            enum:
              - WINTER
              - SPRING
              - SUMMER
              - FALL
            type: string
        - description: Year the title started in.
          explode: false
          in: query
          name: year
          schema:
            description: Year the title started in.
            format: int64
            maximum: 2100
            minimum: 1940
            type: integer
        - description: Keep titles scored above this, on a 0-100 scale.
          explode: false
          in: query
          name: min_score
          schema:
            description: Keep titles scored above this, on a 0-100 scale.
            format: int64
            maximum: 100
            minimum: 0
            type: integer
        - description: Include adult titles. They are left out unless this is set, and the source hides them entirely from a node with no account connected.
          explode: false
          in: query
          name: adult
          schema:
            description: Include adult titles. They are left out unless this is set, and the source hides them entirely from a node with no account connected.
            type: boolean
        - description: Which page of results to return.
          explode: false
          in: query
          name: page
          schema:
            default: 1
            description: Which page of results to return.
            format: int64
            minimum: 1
            type: integer
        - description: How many titles per page.
          explode: false
          in: query
          name: per_page
          schema:
            default: 30
            description: How many titles per page.
            format: int64
            maximum: 50
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Search titles
      tags:
        - media
  /v1/media/{media_ref}:
    get:
      description: Fetched from the source on demand and kept for at most a day, as the source's terms allow. Past that the node asks again; while the source is unreachable the request fails, and clients fall back to what the user's own list already knows about the title.
      operationId: getMediaDetails
      parameters:
        - description: The title's media reference.
          in: path
          name: media_ref
          required: true
          schema:
            description: The title's media reference.
            examples:
              - anilist:154587
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Title details
      tags:
        - media
  /v1/media/{media_ref}/episodes:
    get:
      description: "Titles, synopses and stills per episode, gathered on demand from ani.zip and from the streaming listings AniList carries, each kept for at most a day. A source that fails or knows nothing only leaves its fields empty: the list always has one entry per episode the title is known to have."
      operationId: getMediaEpisodes
      parameters:
        - description: The title's media reference.
          in: path
          name: media_ref
          required: true
          schema:
            description: The title's media reference.
            examples:
              - anilist:154587
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Episodes of a title
      tags:
        - media
  /v1/playback:
    delete:
      description: Ends the session. Whatever was already recorded as watched stays recorded.
      operationId: stopPlayback
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Close the player
      tags:
        - playback
    get:
      description: The node plays one file at a time. Position and duration come from the player itself and arrive as playback events on the socket; this is the state to start from.
      operationId: getPlayback
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: What is playing
      tags:
        - playback
    post:
      description: Opens the player on a scanned file. Starting a second file replaces the first — the node keeps one window. A matched file is marked watched once it is far enough through, and the tracker decides what that means for the user's list.
      operationId: startPlayback
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Play a library file
      tags:
        - playback
  /v1/playback/command:
    post:
      description: "Pause, resume or jump. Deliberately small: the player's own window is in front of the user, and duplicating its controls would only add ways for the two to disagree."
      operationId: controlPlayback
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Steer the open player
      tags:
        - playback
  /v1/playback/files/{id}/direct:
    get:
      description: The file's bytes with range support, for a video element to play directly. Accepts the node token as ?token=, because a video element cannot send headers.
      operationId: getPlaybackDirect
      parameters:
        - description: Library file, as listed by listLibraryFiles.
          in: path
          name: id
          required: true
          schema:
            description: Library file, as listed by listLibraryFiles.
            format: int64
            type: integer
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Serve a file as it is
      tags:
        - playback
  /v1/playback/files/{id}/fonts/{index}:
    get:
      description: Fonts the subtitles were typeset with, as the file carries them. Accepts ?token=.
      operationId: getPlaybackFont
      parameters:
        - description: Library file, as listed by listLibraryFiles.
          in: path
          name: id
          required: true
          schema:
            description: Library file, as listed by listLibraryFiles.
            format: int64
            type: integer
        - description: Track index as the stream description lists it.
          in: path
          name: index
          required: true
          schema:
            description: Track index as the stream description lists it.
            format: int32
            minimum: 0
            type: integer
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: One font attached to the file
      tags:
        - playback
  /v1/playback/files/{id}/hls:
    delete:
      description: Called when the player closes, so encoders stop at once instead of when the idle reaper notices.
      operationId: stopPlaybackHLS
      parameters:
        - description: Library file, as listed by listLibraryFiles.
          in: path
          name: id
          required: true
          schema:
            description: Library file, as listed by listLibraryFiles.
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Stop transcoding a file
      tags:
        - playback
  /v1/playback/files/{id}/hls/audio/{index}/{name}:
    get:
      description: AAC is copied, anything else is encoded to AAC. Accepts ?token=.
      operationId: getPlaybackHLSAudio
      parameters:
        - description: Library file, as listed by listLibraryFiles.
          in: path
          name: id
          required: true
          schema:
            description: Library file, as listed by listLibraryFiles.
            format: int64
            type: integer
        - description: The node token. Repeated into every URL the playlist lists, so the player can follow them.
          explode: false
          in: query
          name: token
          schema:
            description: The node token. Repeated into every URL the playlist lists, so the player can follow them.
            type: string
        - description: Audio track, as the master playlist names it.
          in: path
          name: index
          required: true
          schema:
            description: Audio track, as the master playlist names it.
            format: int32
            minimum: 0
            type: integer
        - description: index.m3u8, or segment-N.ts.
          in: path
          name: name
          required: true
          schema:
            description: index.m3u8, or segment-N.ts.
            type: string
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Playlist or segment of one audio track
      tags:
        - playback
  /v1/playback/files/{id}/hls/master.m3u8:
    get:
      description: For a file the renderer cannot play directly. Video the renderer can decode is copied; only what it cannot is re-encoded, segment by segment as the player asks. Accepts ?token=.
      operationId: getPlaybackHLSMaster
      parameters:
        - description: Library file, as listed by listLibraryFiles.
          in: path
          name: id
          required: true
          schema:
            description: Library file, as listed by listLibraryFiles.
            format: int64
            type: integer
        - description: The node token. Repeated into every URL the playlist lists, so the player can follow them.
          explode: false
          in: query
          name: token
          schema:
            description: The node token. Repeated into every URL the playlist lists, so the player can follow them.
            type: string
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: HLS master playlist of a transcoded file
      tags:
        - playback
  /v1/playback/files/{id}/hls/{quality}/{name}:
    get:
      description: A segment request waits until the encoder has written it. Accepts ?token=.
      operationId: getPlaybackHLSVideo
      parameters:
        - description: Library file, as listed by listLibraryFiles.
          in: path
          name: id
          required: true
          schema:
            description: Library file, as listed by listLibraryFiles.
            format: int64
            type: integer
        - description: The node token. Repeated into every URL the playlist lists, so the player can follow them.
          explode: false
          in: query
          name: token
          schema:
            description: The node token. Repeated into every URL the playlist lists, so the player can follow them.
            type: string
        - description: Rendition, as the master playlist names it.
          in: path
          name: quality
          required: true
          schema:
            description: Rendition, as the master playlist names it.
            type: string
        - description: index.m3u8, or segment-N.ts.
          in: path
          name: name
          required: true
          schema:
            description: index.m3u8, or segment-N.ts.
            type: string
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Playlist or segment of one video rendition
      tags:
        - playback
  /v1/playback/files/{id}/progress:
    post:
      description: The built-in player's counterpart of mpv's position events. The node applies the same rule — 85 % or played to the end — and tells the tracker once.
      operationId: reportPlaybackProgress
      parameters:
        - description: Library file being played.
          in: path
          name: id
          required: true
          schema:
            description: Library file being played.
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Report where the built-in player is
      tags:
        - playback
  /v1/playback/files/{id}/stream:
    get:
      description: Runs ffprobe on the file, once per version of it, and reports its streams together with an RFC 6381 type. The renderer asks its own video element whether it can play that type, which decides between direct play and transcoding.
      operationId: getPlaybackStream
      parameters:
        - description: Library file, as listed by listLibraryFiles.
          in: path
          name: id
          required: true
          schema:
            description: Library file, as listed by listLibraryFiles.
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Describe a file for the built-in player
      tags:
        - playback
  /v1/playback/files/{id}/subtitles/{index}:
    get:
      description: Text tracks are pulled out of the file with ffmpeg on first request, all at once, and converted to ASS so one renderer draws every format. Accepts ?token=.
      operationId: getPlaybackSubtitle
      parameters:
        - description: Library file, as listed by listLibraryFiles.
          in: path
          name: id
          required: true
          schema:
            description: Library file, as listed by listLibraryFiles.
            format: int64
            type: integer
        - description: Track index as the stream description lists it.
          in: path
          name: index
          required: true
          schema:
            description: Track index as the stream description lists it.
            format: int32
            minimum: 0
            type: integer
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: One subtitle track as ASS
      tags:
        - playback
  /v1/playback/files/{id}/thumbnail:
    get:
      description: One frame from the middle of the file, cut with ffmpeg on first request and kept until the file changes. The frame is picked per file, so a season does not show the same moment twice, and stays the same between requests. Stands in for an episode image no source has. Accepts ?token=.
      operationId: getPlaybackThumbnail
      parameters:
        - description: Library file, as listed by listLibraryFiles.
          in: path
          name: id
          required: true
          schema:
            description: Library file, as listed by listLibraryFiles.
            format: int64
            type: integer
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: A still from the file
      tags:
        - playback
  /v1/reader/chapters/{ref}:
    get:
      description: "The chapter's pages in reading order, from whichever source the reference names. Chapter reference: local:<file id>, opds:<server id>:<entry id> or mangadex:<chapter id>."
      operationId: getReaderChapterByRef
      parameters:
        - description: "Chapter reference: local:<file id>, opds:<server id>:<entry id> or mangadex:<chapter id>."
          in: path
          name: ref
          required: true
          schema:
            description: "Chapter reference: local:<file id>, opds:<server id>:<entry id> or mangadex:<chapter id>."
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Pages of a chapter
      tags:
        - reader
  /v1/reader/chapters/{ref}/pages/{index}:
    get:
      description: The page's image, served by the node whichever source it comes from. Accepts ?token=, because an image element cannot send headers.
      operationId: getReaderPageByRef
      parameters:
        - description: Chapter reference, as in getReaderChapterByRef.
          in: path
          name: ref
          required: true
          schema:
            description: Chapter reference, as in getReaderChapterByRef.
            type: string
        - description: Position in reading order, from the chapter listing.
          in: path
          name: index
          required: true
          schema:
            description: Position in reading order, from the chapter listing.
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: One page of a chapter
      tags:
        - reader
  /v1/reader/chapters/{ref}/progress:
    post:
      description: Reaching the last page counts the chapter as read. Only a whole chapter number moves the user's list; an extra such as 12.5 is read without moving it. The tracker never lowers progress.
      operationId: reportReaderPageByRef
      parameters:
        - description: Chapter being read, as in getReaderChapterByRef.
          in: path
          name: ref
          required: true
          schema:
            description: Chapter being read, as in getReaderChapterByRef.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Report the page the reader is on
      tags:
        - reader
  /v1/reader/files/{id}/chapter:
    get:
      description: The same as getReaderChapterByRef with local:<id>.
      operationId: getReaderChapter
      parameters:
        - description: Library file, as listed by listLibraryFiles.
          in: path
          name: id
          required: true
          schema:
            description: Library file, as listed by listLibraryFiles.
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Pages of a comic chapter
      tags:
        - reader
  /v1/reader/files/{id}/pages/{index}:
    get:
      description: The same as getReaderPageByRef with local:<id>. Accepts ?token=, because an image element cannot send headers.
      operationId: getReaderPage
      parameters:
        - description: Library file, as listed by listLibraryFiles.
          in: path
          name: id
          required: true
          schema:
            description: Library file, as listed by listLibraryFiles.
            format: int64
            type: integer
        - description: Position in reading order, from the chapter listing.
          in: path
          name: index
          required: true
          schema:
            description: Position in reading order, from the chapter listing.
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: One page of a comic chapter
      tags:
        - reader
  /v1/reader/files/{id}/progress:
    post:
      description: The same as reportReaderPageByRef with local:<id>.
      operationId: reportReaderPage
      parameters:
        - description: Library file being read.
          in: path
          name: id
          required: true
          schema:
            description: Library file being read.
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Report the page the reader is on
      tags:
        - reader
  /v1/reader/status:
    get:
      description: Reports whether the reader module is wired.
      operationId: getReaderStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Reader module status
      tags:
        - reader
  /v1/sync/status:
    get:
      description: Reports whether the sync module is wired. Placeholder for phase 0.
      operationId: getSyncStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOutputBody1"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Sync module status
      tags:
        - sync
  /v1/torrent/check:
    post:
      description: Signs in to qBittorrent with the given address and credentials, saved or not, and reports its version.
      operationId: checkTorrentClient
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckTorrentClientInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TorrentCheckResult"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Try a torrent client connection
      tags:
        - torrent
  /v1/torrent/downloads:
    get:
      description: Downloads the node added to the torrent client, newest first, each with what the client last said about it. Changes arrive on the torrent topic.
      operationId: listTorrentDownloads
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TorrentDownloadsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Torrent downloads
      tags:
        - torrent
    post:
      description: Adds a magnet link or a .torrent file to the torrent client, saving into the title's folder inside the download folder. When it finishes, its videos join the library matched to the title, each with the episode its name gives.
      operationId: addTorrentDownload
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTorrentDownloadInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TorrentDownload"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: TorrentDownload a torrent for a title
      tags:
        - torrent
  /v1/torrent/downloads/{id}:
    delete:
      description: Takes the torrent out of the client and the download off the list. Needs the client reachable, so no torrent is left running that the node no longer knows. Files already in the library stay there unless with_files.
      operationId: removeTorrentDownload
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
        - description: Also delete the downloaded files from disk.
          explode: false
          in: query
          name: with_files
          schema:
            description: Also delete the downloaded files from disk.
            type: boolean
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Remove a torrent download
      tags:
        - torrent
  /v1/torrent/downloads/{id}/files:
    get:
      description: Every file in the torrent with the episode the library reads from its name, and whether the client downloads it.
      operationId: listTorrentFiles
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TorrentFilesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Files of a torrent
      tags:
        - torrent
    put:
      description: The client downloads only these files. A torrent added with choose_files starts once the choice is made.
      operationId: selectTorrentFiles
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectTorrentFilesInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Choose which files to download
      tags:
        - torrent
  /v1/torrent/downloads/{id}/pause:
    post:
      operationId: pauseTorrentDownload
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Pause a torrent download
      tags:
        - torrent
  /v1/torrent/downloads/{id}/resume:
    post:
      operationId: resumeTorrentDownload
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Resume a torrent download
      tags:
        - torrent
  /v1/torrent/profile:
    get:
      description: What the user likes in a release. Search scores every result by it and marks the best.
      operationId: getTorrentProfile
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TorrentProfile"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Release profile
      tags:
        - torrent
    put:
      operationId: putTorrentProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TorrentProfile"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TorrentProfile"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Save the release profile
      tags:
        - torrent
  /v1/torrent/search:
    get:
      description: "Asks every source for the title's names, or for q, merges what they find by info hash, and reads episodes, quality and group from each name. With an episode, releases that cannot hold it are left out and the rest come in order: the episode alone, batches that hold it, names without episodes. A source that fails is reported in sources, and the others still answer."
      operationId: searchTorrents
      parameters:
        - description: The title searched for; its names are the queries unless q is given.
          explode: false
          in: query
          name: media_ref
          schema:
            description: The title searched for; its names are the queries unless q is given.
            type: string
        - description: Only releases that hold this episode; 0 for any.
          explode: false
          in: query
          name: episode
          schema:
            description: Only releases that hold this episode; 0 for any.
            format: int64
            minimum: 0
            type: integer
        - description: Search for this instead of the title's names.
          explode: false
          in: query
          name: q
          schema:
            description: Search for this instead of the title's names.
            maxLength: 200
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TorrentSearchResult"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Search for releases
      tags:
        - torrent
  /v1/torrent/settings:
    get:
      description: The password is never returned; has_password says whether one is saved.
      operationId: getTorrentSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TorrentSettings"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Torrent client settings
      tags:
        - torrent
    put:
      description: The password goes to the node's secrets file, not the database.
      operationId: putTorrentSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutTorrentSettingsInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TorrentSettings"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Save torrent client settings
      tags:
        - torrent
  /v1/torrent/sources:
    get:
      description: The user's Torznab endpoints — Jackett, Prowlarr. The node ships no indexers of its own.
      operationId: listTorrentSources
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TorrentSourcesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Release search sources
      tags:
        - torrent
    post:
      description: The API key goes to the node's secrets file, not the database.
      operationId: createTorrentSource
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TorrentSourceBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TorrentSource"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Add a release search source
      tags:
        - torrent
  /v1/torrent/sources/check:
    post:
      description: Asks the endpoint for its capabilities, before or after it is saved.
      operationId: checkTorrentSource
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckTorrentSourceInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TorrentSourceCaps"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Try a release search source
      tags:
        - torrent
  /v1/torrent/sources/{id}:
    delete:
      description: Forgets the source and its key.
      operationId: deleteTorrentSource
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Remove a release search source
      tags:
        - torrent
    put:
      operationId: updateTorrentSource
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TorrentSourceBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TorrentSource"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Change a release search source
      tags:
        - torrent
  /v1/tracker/entries:
    get:
      description: Served from the node's mirror, so it works offline. A stale mirror is returned immediately while a refresh runs; a `tracker` event announces the result.
      operationId: listTrackerEntries
      parameters:
        - description: Which collection to read.
          explode: false
          in: query
          name: type
          required: true
          schema:
            description: Which collection to read.
            enum:
              - anime
              - manga
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntriesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Tracker entries
      tags:
        - tracker
  /v1/tracker/entries/{media_ref}:
    put:
      description: "Applies the change locally and queues it for AniList, so it works offline. The returned entry already carries the change with `sync_pending: true`; a `tracker` event with reason `synced` follows once AniList has it. A progress lower than what AniList already holds is only sent when it is lower than what the user saw — so an older offline edit never rolls back progress made on another device. A title not in the lists yet is added instead: that goes straight to AniList and needs it reachable, lands in `PLANNING` unless a status is given, and comes back already synced."
      operationId: updateTrackerEntry
      parameters:
        - description: The entry's media reference, as returned by listTrackerEntries.
          in: path
          name: media_ref
          required: true
          schema:
            description: The entry's media reference, as returned by listTrackerEntries.
            examples:
              - anilist:154587
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEntryInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a tracker entry
      tags:
        - tracker
  /v1/tracker/lists:
    get:
      description: Every list the user made, in one response. Anime and manga lists are read from the node's AniList mirror, so they work offline; the other media types are the node's own. Status lists are not included — those are an entry's status, not a list.
      operationId: listTrackerLists
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Custom lists
      tags:
        - tracker
    post:
      description: An anime or manga list is created in the user's AniList account and needs AniList reachable; the other media types are stored in this node and work offline.
      operationId: createTrackerList
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomList"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a custom list
      tags:
        - tracker
  /v1/tracker/lists/{id}:
    delete:
      description: Removes the list. Titles in it keep their entry and their status; they only lose this list's label.
      operationId: deleteTrackerList
      parameters:
        - description: The list's identifier, as returned by listTrackerLists.
          in: path
          name: id
          required: true
          schema:
            description: The list's identifier, as returned by listTrackerLists.
            examples:
              - anilist:anime:Rewatch
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a custom list
      tags:
        - tracker
    patch:
      description: "The icon is the node's own: an AniList list keeps its name in AniList and its icon here, and the icon follows the list when it is renamed."
      operationId: renameTrackerList
      parameters:
        - description: The list's identifier, as returned by listTrackerLists.
          in: path
          name: id
          required: true
          schema:
            description: The list's identifier, as returned by listTrackerLists.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameListInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Rename a custom list or change its icon
      tags:
        - tracker
  /v1/tracker/refresh:
    post:
      description: Starts a background refresh; the result arrives as a `tracker` event.
      operationId: refreshTrackerEntries
      parameters:
        - description: Which collection to read.
          explode: false
          in: query
          name: type
          required: true
          schema:
            description: Which collection to read.
            enum:
              - anime
              - manga
            type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedOutputBody"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Refresh tracker entries
      tags:
        - tracker
security:
  - nodeToken: []
tags:
  - description: Liveness and build information.
    name: health
  - description: Local file scanning and matching against catalog titles.
    name: library
  - description: Providers and download management.
    name: torrent
  - description: mpv control, direct play and transcoding.
    name: playback
  - description: Image-based and epub/pdf reading.
    name: reader
  - description: Progress synchronisation with a paired cloud account.
    name: sync
  - description: Plugin runtime for metadata and torrent providers.
    name: extension
