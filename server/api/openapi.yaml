components:
  schemas:
    AcceptedOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AcceptedOutputBody.json
          format: uri
          readOnly: true
          type: string
        accepted:
          description: The refresh was started or is already running.
          type: boolean
      required:
        - accepted
      type: object
    Account:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Account.json
          format: uri
          readOnly: true
          type: string
