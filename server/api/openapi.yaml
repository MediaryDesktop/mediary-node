components:
  schemas:
    AcceptedOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AcceptedOutputBody.json
          format: uri
          readOnly: true
          type: string
        accepted:
          description: The refresh was started or is already running.
          type: boolean
      required:
        - accepted
      type: object
    Account:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Account.json
          format: uri
          readOnly: true
          type: string
        avatar_url:
          type:
            - string
            - "null"
        display_adult_content:
          type: boolean
        id:
          format: int64
          type: integer
        name:
          type: string
        score_format:
          type: string
        site_url:
          type: string
      required:
        - id
        - name
        - site_url
        - avatar_url
        - score_format
        - display_adult_content
      type: object
    AddRootInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AddRootInputBody.json
          format: uri
          readOnly: true
          type: string
        path:
          description: Absolute path to an existing folder on this machine.
          examples:
            - D:\Anime
          maxLength: 4096
          minLength: 1
          type: string
      required:
        - path
      type: object
    AiringEpisode:
      additionalProperties: false
      properties:
        airing_at:
          format: date-time
          type: string
        episode:
          format: int64
          type: integer
      required:
        - episode
        - airing_at
      type: object
    CollectionOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CollectionOutputBody.json
          format: uri
          readOnly: true
          type: string
        collection:
          $ref: "#/components/schemas/LibraryCollection"
          description: The library seen as titles rather than as files.
        sources:
          description: Attribution for every field that came from an external source.
          items:
            $ref: "#/components/schemas/Source"
          type:
            - array
            - "null"
      required:
        - collection
        - sources
      type: object
    ControlInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ControlInputBody.json
          format: uri
          readOnly: true
          type: string
        action:
          description: What to do with the open player.
          enum:
            - pause
            - resume
            - seek
          type: string
        position:
          description: Seconds from the start, for a seek.
          format: double
          minimum: 0
          type: number
      required:
        - action
      type: object
    Counts:
      additionalProperties: false
      properties:
        missing:
          description: Of those, files the last scan did not find.
          format: int64
          type: integer
        total:
          description: Files the filter matches.
          format: int64
          type: integer
        unmatched:
          description: Of those, files that belong to no title yet.
          format: int64
          type: integer
      required:
        - total
        - unmatched
        - missing
      type: object
    CreateListInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateListInputBody.json
          format: uri
          readOnly: true
          type: string
        media_type:
          description: "The one media type this list holds. A list never mixes types: anime and manga lists are created in the user's AniList account, the rest in this node."
          enum:
            - anime
            - manga
            - movie
            - series
            - dorama
            - book
          type: string
        name:
          description: What to call the list.
          maxLength: 100
          minLength: 1
          type: string
      required:
        - media_type
        - name
      type: object
    CustomList:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CustomList.json
          format: uri
          readOnly: true
          type: string
        count:
          description: How many titles are in the list.
          format: int64
          type: integer
        covers:
          description: Up to four cover images, for the list's thumbnail.
          items:
            type: string
          type:
            - array
            - "null"
        id:
          description: Opaque identifier; pass it back URL-encoded to rename or delete the list.
          type: string
        media_type:
          description: The one media type this list holds.
          enum:
            - anime
            - manga
            - movie
            - series
            - dorama
            - book
          type: string
        name:
          type: string
        provider:
          description: "Where the list lives: anilist or local."
          enum:
            - anilist
            - local
          type: string
        updated_at:
          description: When a title in the list last changed. Absent for an empty list.
          format: date-time
          type: string
      required:
        - id
        - provider
        - media_type
        - name
        - count
        - covers
      type: object
    Date:
      additionalProperties: false
      properties:
        day:
          format: int64
          type:
            - integer
            - "null"
        month:
          format: int64
          type:
            - integer
            - "null"
        year:
          format: int64
          type:
            - integer
            - "null"
      required:
        - year
        - month
        - day
      type: object
    DetailsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DetailsOutputBody.json
          format: uri
          readOnly: true
          type: string
        media:
          $ref: "#/components/schemas/MediaDetails"
          description: Everything a title page shows about the title itself.
        sources:
          description: Attribution for every field that came from an external source.
          items:
            $ref: "#/components/schemas/Source"
          type:
            - array
            - "null"
      required:
        - media
        - sources
      type: object
    EntriesOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/EntriesOutputBody.json
          format: uri
          readOnly: true
          type: string
        entries:
          description: One entry per title, in AniList's list order.
          items:
            $ref: "#/components/schemas/Entry"
          type:
            - array
            - "null"
        fetched_at:
          description: When AniList last answered for this collection.
          format: date-time
          type: string
        lists:
          description: Status and custom lists with their sizes.
          items:
            $ref: "#/components/schemas/List"
          type:
            - array
            - "null"
        media_type:
          description: The collection this response describes.
          type: string
        sources:
          description: Attribution for every field that came from an external source.
          items:
            $ref: "#/components/schemas/Source"
          type:
            - array
            - "null"
        stale:
          description: True when the data is older than the refresh interval; a refresh is already running.
          type: boolean
      required:
        - media_type
        - entries
        - lists
        - fetched_at
        - stale
        - sources
      type: object
    Entry:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Entry.json
          format: uri
          readOnly: true
          type: string
        completed_at:
          $ref: "#/components/schemas/Date"
        custom_lists:
          items:
            type: string
          type:
            - array
            - "null"
        media:
          $ref: "#/components/schemas/Media"
        media_ref:
          type: string
        media_type:
          type: string
        notes:
          type: string
        private:
          type: boolean
        progress:
          format: int64
          type: integer
        progress_volumes:
          format: int64
          type:
            - integer
            - "null"
        provider:
          type: string
        repeat:
          format: int64
          type: integer
        score:
          format: int64
          type: integer
        started_at:
          $ref: "#/components/schemas/Date"
        status:
          type: string
        sync_pending:
          type: boolean
        updated_at:
          format: date-time
          type: string
      required:
        - media_ref
        - provider
        - media_type
        - status
        - score
        - progress
        - progress_volumes
        - repeat
        - private
        - notes
        - started_at
        - completed_at
        - updated_at
        - custom_lists
        - sync_pending
        - media
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    File:
      additionalProperties: false
      properties:
        duration_seconds:
          description: How long the file runs, read out of its container during the scan. Absent for a container the node cannot read and for everything that is not video.
          format: int64
          type: integer
        id:
          description: Identifier of the file, stable while its path does not change.
          format: int64
          type: integer
        kind:
          description: Form of media the extension points at.
          enum:
            - video
            - manga
            - book
          type: string
        match:
          $ref: "#/components/schemas/Match"
          description: What the file was matched to. Absent while unmatched.
        missing:
          description: True when the last scan did not find the file where it used to be.
          type: boolean
        modified_at:
          description: Modification time the last scan saw.
          format: date-time
          type: string
        parsed:
          $ref: "#/components/schemas/Parsed"
          description: What the file's name says. Present whether or not the file is matched.
        path:
          description: Absolute path, for the player and for revealing the file.
          type: string
        rel_path:
          description: Path relative to the root, with forward slashes.
          type: string
        root_id:
          description: Root the file was found under.
          format: int64
          type: integer
        size_bytes:
          description: Size on disk.
          format: int64
          type: integer
      required:
        - id
        - root_id
        - path
        - rel_path
        - kind
        - size_bytes
        - modified_at
        - missing
        - parsed
      type: object
    FileOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/FileOutputBody.json
          format: uri
          readOnly: true
          type: string
        file:
          $ref: "#/components/schemas/File"
          description: The file with its match applied.
      required:
        - file
      type: object
    FilePage:
      additionalProperties: false
      properties:
        counts:
          $ref: "#/components/schemas/Counts"
          description: Totals for the whole library behind the filters over the list.
        items:
          description: One page of files.
          items:
            $ref: "#/components/schemas/File"
          type:
            - array
            - "null"
        limit:
          description: Page size that was applied.
          format: int64
          type: integer
        offset:
          description: Offset that was applied.
          format: int64
          type: integer
        titles:
          description: Every title the files on this page are matched to, once each.
          items:
            $ref: "#/components/schemas/MatchedTitle"
          type:
            - array
            - "null"
        total:
          description: How many files match the filter in total.
          format: int64
          type: integer
      required:
        - items
        - total
        - limit
        - offset
        - counts
        - titles
      type: object
    FilesOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/FilesOutputBody.json
          format: uri
          readOnly: true
          type: string
        files:
          $ref: "#/components/schemas/FilePage"
          description: One page of scanned files with their matches.
      required:
        - files
      type: object
    FilterOptions:
      additionalProperties: false
      properties:
        fetched_at:
          format: date-time
          type: string
        genres:
          items:
            type: string
          type:
            - array
            - "null"
        tags:
          items:
            $ref: "#/components/schemas/FilterTag"
          type:
            - array
            - "null"
      required:
        - genres
        - tags
        - fetched_at
      type: object
    FilterOptionsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/FilterOptionsOutputBody.json
          format: uri
          readOnly: true
          type: string
        options:
          $ref: "#/components/schemas/FilterOptions"
          description: The vocabulary the filter panel offers.
        sources:
          description: Attribution for every field that came from an external source.
          items:
            $ref: "#/components/schemas/Source"
          type:
            - array
            - "null"
      required:
        - options
        - sources
      type: object
    FilterTag:
      additionalProperties: false
      properties:
        category:
          type: string
        is_adult:
          type: boolean
        name:
          type: string
      required:
        - name
        - category
        - is_adult
      type: object
    FuzzyDate:
      additionalProperties: false
      properties:
        day:
          format: int64
          type:
            - integer
            - "null"
        month:
          format: int64
          type:
            - integer
            - "null"
        year:
          format: int64
          type:
            - integer
            - "null"
      required:
        - year
        - month
        - day
      type: object
    HealthOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/HealthOutputBody.json
          format: uri
          readOnly: true
          type: string
        built:
          description: Build timestamp.
          examples:
            - "2026-08-27T12:00:00Z"
          type: string
        commit:
          description: Git commit the build came from.
          examples:
            - abc1234
          type: string
        linked:
          description: True when the node is paired with a cloud account.
          type: boolean
        status:
          description: Node status.
          examples:
            - ok
          type: string
        version:
          description: Semantic version of the running build.
          examples:
            - 0.1.0
          type: string
      required:
        - status
        - version
        - commit
        - built
        - linked
      type: object
    LibraryCollection:
      additionalProperties: false
      properties:
        entries:
          description: Titles the library holds files of, by name.
          items:
            $ref: "#/components/schemas/LibraryCollectionEntry"
          type:
            - array
            - "null"
        files:
          description: Files in the library in total.
          format: int64
          type: integer
        missing:
          description: Files the last scan did not find where they used to be.
          format: int64
          type: integer
        unmatched:
          description: "Files that belong to no title yet. Openings and other extras are left out: they belong to none by design."
          format: int64
          type: integer
      required:
        - entries
        - files
        - unmatched
        - missing
      type: object
    LibraryCollectionEntry:
      additionalProperties: false
      properties:
        file_count:
          description: Files matched to this title.
          format: int64
          type: integer
        media_ref:
          description: The title, as provider:id.
          type: string
        missing_count:
          description: Of those, files the last scan did not find.
          format: int64
          type: integer
        title:
          $ref: "#/components/schemas/MatchedTitle"
          description: Name and poster, when the node can describe the title. Absent for a title no source has answered for yet.
      required:
        - media_ref
        - file_count
        - missing_count
      type: object
    List:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        custom:
          type: boolean
        name:
          type: string
        status:
          type:
            - string
            - "null"
      required:
        - name
        - custom
        - status
        - count
      type: object
    ListsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListsOutputBody.json
          format: uri
          readOnly: true
          type: string
        lists:
          description: Every custom list the user made, across all media types.
          items:
            $ref: "#/components/schemas/CustomList"
          type:
            - array
            - "null"
        sources:
          description: Attribution for every field that came from an external source.
          items:
            $ref: "#/components/schemas/Source"
          type:
            - array
            - "null"
      required:
        - lists
        - sources
      type: object
    Match:
      additionalProperties: false
      properties:
        confidence:
          description: How sure the matcher was, from 0 to 1. A manual match is always 1.
          format: double
          type: number
        episode:
          description: Episode or chapter number within the title.
          format: int64
          type: integer
        media_ref:
          description: The title this file belongs to, as provider:id.
          type: string
        season:
          description: Season number, when the title has seasons.
          format: int64
          type: integer
        source:
          description: Who decided the match. A manual one is never overwritten by a scan.
          enum:
            - auto
            - manual
          type: string
      required:
        - media_ref
        - confidence
        - source
      type: object
    MatchedTitle:
      additionalProperties: false
      properties:
        cover_color:
          description: Dominant colour of the poster, for a placeholder while it loads.
          type: string
        cover_image:
          description: Poster for the title.
          type: string
        episodes:
          description: Episodes the title has in total, or chapters for a comic.
          format: int64
          type: integer
        format:
          description: TV, MOVIE, OVA and so on, as the source names it.
          type: string
        media_ref:
          description: The title, as provider:id.
          type: string
        media_type:
          description: Which catalog the title comes from.
          enum:
            - anime
            - manga
          type: string
        title:
          description: The title as the user's source spells it.
          type: string
      required:
        - media_ref
        - title
      type: object
    Media:
      additionalProperties: false
      properties:
        average_score:
          format: int64
          type:
            - integer
            - "null"
        banner_image:
          type:
            - string
            - "null"
        chapters:
          format: int64
          type:
            - integer
            - "null"
        cover_color:
          type:
            - string
            - "null"
        cover_image:
          type:
            - string
            - "null"
        episodes:
          format: int64
          type:
            - integer
            - "null"
        format:
          type:
            - string
            - "null"
        genres:
          items:
            type: string
          type:
            - array
            - "null"
        is_adult:
          type: boolean
        season_year:
          format: int64
          type:
            - integer
            - "null"
        site_url:
          type: string
        status:
          type:
            - string
            - "null"
        synonyms:
          items:
            type: string
          type:
            - array
            - "null"
        title:
          $ref: "#/components/schemas/Title"
        volumes:
          format: int64
          type:
            - integer
            - "null"
      required:
        - title
        - format
        - status
        - episodes
        - chapters
        - volumes
        - season_year
        - is_adult
        - cover_image
        - cover_color
        - banner_image
        - site_url
        - genres
        - average_score
      type: object
    MediaDetails:
      additionalProperties: false
      properties:
        average_score:
          format: int64
          type:
            - integer
            - "null"
        banner_image:
          type:
            - string
            - "null"
        chapters:
          format: int64
          type:
            - integer
            - "null"
        country_of_origin:
          type:
            - string
            - "null"
        cover_color:
          type:
            - string
            - "null"
        cover_image:
          type:
            - string
            - "null"
        description:
          type: string
        duration:
          format: int64
          type:
            - integer
            - "null"
        end_date:
          $ref: "#/components/schemas/FuzzyDate"
        episodes:
          format: int64
          type:
            - integer
            - "null"
        favourites:
          format: int64
          type:
            - integer
            - "null"
        fetched_at:
          format: date-time
          type: string
        format:
          type:
            - string
            - "null"
        genres:
          items:
            type: string
          type:
            - array
            - "null"
        is_adult:
          type: boolean
        mean_score:
          format: int64
          type:
            - integer
            - "null"
        media_ref:
          type: string
        media_type:
          type: string
        next_airing_episode:
          $ref: "#/components/schemas/AiringEpisode"
        popularity:
          format: int64
          type:
            - integer
            - "null"
        relations:
          items:
            $ref: "#/components/schemas/RelatedMedia"
          type:
            - array
            - "null"
        season:
          type:
            - string
            - "null"
        season_year:
          format: int64
          type:
            - integer
            - "null"
        site_url:
          type: string
        source:
          type:
            - string
            - "null"
        start_date:
          $ref: "#/components/schemas/FuzzyDate"
        status:
          type:
            - string
            - "null"
        studios:
          items:
            type: string
          type:
            - array
            - "null"
        synonyms:
          items:
            type: string
          type:
            - array
            - "null"
        title:
          $ref: "#/components/schemas/TitleNames"
        trailer:
          $ref: "#/components/schemas/Trailer"
        volumes:
          format: int64
          type:
            - integer
            - "null"
      required:
        - media_ref
        - media_type
        - format
        - status
        - title
        - synonyms
        - description
        - cover_image
        - cover_color
        - banner_image
        - episodes
        - chapters
        - volumes
        - duration
        - season
        - season_year
        - start_date
        - end_date
        - average_score
        - mean_score
        - popularity
        - favourites
        - genres
        - studios
        - source
        - country_of_origin
        - is_adult
        - site_url
        - trailer
        - next_airing_episode
        - relations
        - fetched_at
      type: object
    MediaSummary:
      additionalProperties: false
      properties:
        average_score:
          format: int64
          type:
            - integer
            - "null"
        banner_image:
          type:
            - string
            - "null"
        chapters:
          format: int64
          type:
            - integer
            - "null"
        cover_color:
          type:
