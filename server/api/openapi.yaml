info:
  description: "Local API of a Mediary self-hosted node: library, downloads, playback, reader and cloud sync. Bound to loopback and gated by a local token."
  title: Mediary Node API
  version: 0.0.0-dev
openapi: 3.1.0
paths:
  /v1/anilist/session:
    delete:
      description: Forgets the token and deletes the mirrored collections.
      operationId: disconnectAniList
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Disconnect the AniList account
      tags:
        - tracker
    get:
      operationId: getAniListSession
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: AniList connection
      tags:
        - tracker
    put:
      description: Validates the token against AniList before storing it, then starts fetching both collections in the background.
      operationId: connectAniList
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Connect an AniList account
      tags:
        - tracker
