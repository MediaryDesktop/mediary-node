        sources:
          description: Attribution for every field that came from an external source.
          items:
            $ref: "#/components/schemas/Source"
          type:
            - array
            - "null"
        suggestions:
          description: Candidate titles, best first.
          items:
            $ref: "#/components/schemas/Suggestion"
          type:
            - array
            - "null"
      required:
        - suggestions
        - sources
      type: object
    Title:
      additionalProperties: false
      properties:
        english:
          type:
            - string
            - "null"
        native:
          type:
            - string
            - "null"
        romaji:
          type:
            - string
            - "null"
        user_preferred:
          type:
            - string
            - "null"
      required:
        - user_preferred
        - romaji
        - english
        - native
      type: object
    TitleNames:
      additionalProperties: false
      properties:
        english:
          type:
            - string
            - "null"
        native:
          type:
            - string
            - "null"
        romaji:
          type:
            - string
            - "null"
        user_preferred:
          type:
            - string
            - "null"
      required:
        - user_preferred
        - romaji
        - english
        - native
      type: object
    Trailer:
      additionalProperties: false
      properties:
        id:
          description: Video id on the hosting site.
          type: string
        site:
          description: Where the video lives, e.g. youtube or dailymotion.
          type: string
        thumbnail:
          description: Preview frame for the trailer.
          type:
            - string
            - "null"
      required:
        - id
        - site
        - thumbnail
      type: object
    UpdateEntryInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UpdateEntryInputBody.json
          format: uri
          readOnly: true
          type: string
        completed_at:
          $ref: "#/components/schemas/Date"
          description: When the user finished the title. Send every field empty to clear it.
        custom_lists:
          description: The custom lists this title belongs to, by name. The lists left out are the ones it leaves.
          items:
            type: string
          type: array
        notes:
          description: Private notes only the account owner sees.
          type: string
        progress:
          description: Episodes watched or chapters read.
          format: int64
          minimum: 0
          type: integer
        progress_volumes:
          description: Volumes read; manga only.
          format: int64
          minimum: 0
          type: integer
        repeat:
          description: How many times the title was rewatched or reread.
          format: int64
          minimum: 0
          type: integer
        score:
          description: Score on a 0-100 scale; clients convert from the account's score format.
          format: int64
          maximum: 100
          minimum: 0
          type: integer
        started_at:
          $ref: "#/components/schemas/Date"
          description: When the user started the title. Send every field empty to clear it.
        status:
          description: New list status.
          enum:
            - CURRENT
            - PLANNING
            - COMPLETED
            - DROPPED
            - PAUSED
            - REPEATING
          type: string
      type: object
  securitySchemes:
    nodeToken:
      description: The node's local token, generated on first start and read by the desktop shell.
      in: header
      name: X-Mediary-Node-Token
      type: apiKey
info:
  description: "Local API of a Mediary self-hosted node: library, downloads, playback, reader and cloud sync. Bound to loopback and gated by a local token."
  title: Mediary Node API
  version: 0.0.0-dev
openapi: 3.1.0
paths:
  /v1/anilist/session:
    delete:
      description: Forgets the token and deletes the mirrored collections.
      operationId: disconnectAniList
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Disconnect the AniList account
      tags:
        - tracker
    get:
      operationId: getAniListSession
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: AniList connection
      tags:
        - tracker
    put:
      description: Validates the token against AniList before storing it, then starts fetching both collections in the background.
      operationId: connectAniList
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Connect an AniList account
      tags:
        - tracker
  /v1/extension/status:
    get:
      description: Reports whether the extension module is wired. Placeholder for phase 0.
      operationId: getExtensionStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOutputBody3"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Extension module status
      tags:
        - extension
  /v1/health:
    get:
      description: Reports liveness, the running build and whether a cloud account is paired.
      operationId: getNodeHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Node health
      tags:
        - health
  /v1/library/collection:
    get:
      description: "Every title the library holds files of, by name, with how many files each has. This is what the library shelf is drawn from: grouping a page of files into titles on the client would both cost a page of files and miss everything past it."
      operationId: getLibraryCollection
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: The library as titles
      tags:
        - library
  /v1/library/files:
    get:
      description: Files the last scan recorded, with the title each was matched to. A file the scan no longer finds is kept and reported as missing, so an unplugged drive does not take the user's manual matches with it.
      operationId: listLibraryFiles
      parameters:
        - description: Only files under this root.
          explode: false
          in: query
          name: root_id
          schema:
            description: Only files under this root.
            format: int64
            type: integer
        - description: Only files whose extension points at this form of media.
          explode: false
          in: query
          name: kind
          schema:
            description: Only files whose extension points at this form of media.
            enum:
              - video
              - manga
              - book
            type: string
        - description: Only files whose name reads as this. Use it to leave out openings and extras, which are never episodes.
          explode: false
          in: query
          name: form
          schema:
            description: Only files whose name reads as this. Use it to leave out openings and extras, which are never episodes.
            enum:
              - series
              - movie
              - special
              - extra
              - manga
              - book
            type: string
        - description: Only files that are not matched to a title yet.
          explode: false
          in: query
          name: unmatched
          schema:
            description: Only files that are not matched to a title yet.
            type: boolean
        - description: Page size.
          explode: false
          in: query
          name: limit
          schema:
            default: 100
            description: Page size.
            format: int64
            maximum: 500
            minimum: 1
            type: integer
        - description: How many files to skip.
          explode: false
          in: query
          name: offset
          schema:
            description: How many files to skip.
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Scanned files
      tags:
        - library
  /v1/library/files/{id}/candidates:
    get:
      description: "Titles the file's name could refer to, best first, each with how well it fits. This is the other half of the automatic match: what the node would not decide on its own it offers here, for the user to confirm with setLibraryFileMatch. Entries already on the user's own list are marked and come from the node's mirror, so they are offered even while the source is unreachable."
      operationId: listLibraryFileCandidates
      parameters:
        - description: Identifier of the file to find candidates for.
          in: path
          name: id
          required: true
          schema:
            description: Identifier of the file to find candidates for.
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestionsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: What this file could be
      tags:
        - library
  /v1/library/files/{id}/match:
    delete:
      description: Leaves the file unmatched so the next scan can work it out again.
      operationId: deleteLibraryFileMatch
      parameters:
        - description: Identifier of the file whose match to forget.
          in: path
          name: id
          required: true
          schema:
            description: Identifier of the file whose match to forget.
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Forget a file's match
      tags:
        - library
    put:
      description: Ties the file to a title the user picked. A manual match outranks anything a later scan works out on its own, so a correction is made once and not after every scan.
      operationId: setLibraryFileMatch
      parameters:
        - description: Identifier of the file to match.
          in: path
          name: id
          required: true
          schema:
            description: Identifier of the file to match.
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMatchInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Match a file by hand
      tags:
        - library
  /v1/library/roots:
    get:
      description: The folders the node scans, with how many files each holds and when it was last walked.
      operationId: listLibraryRoots
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Library folders
      tags:
        - library
    post:
      description: The folder has to exist and must not sit inside — or contain — a folder already watched, which would record the same file twice.
      operationId: addLibraryRoot
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddRootInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootOutputBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Add a library folder
      tags:
        - library
  /v1/library/roots/{id}:
    delete:
      description: Forgets the folder and everything the node recorded about the files in it, including their matches. Nothing on disk is touched.
      operationId: deleteLibraryRoot
      parameters:
        - description: Identifier of the root to stop watching.
          in: path
          name: id
          required: true
          schema:
            description: Identifier of the root to stop watching.
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Stop watching a folder
      tags:
        - library
  /v1/library/scan:
    get:
      description: What the running scan has found so far, or the outcome of the last one.
      operationId: getLibraryScan
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Scan status
      tags:
        - library
    post:
      description: "Starts a scan and returns at once: walking a large library takes minutes. Progress arrives as library.scan events on the socket. Only one scan runs at a time. Files whose size and modification time did not change are not touched, so a rescan is cheap, and a folder that cannot be read right now is skipped rather than emptied."
      operationId: startLibraryScan
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanInputBody"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanOutputBody"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Scan the library
      tags:
        - library
  /v1/library/scan/history:
    get:
      description: Every scan the node has run, newest first, kept independently of the single current-scan slot so a scan from days ago is still readable.
      operationId: listLibraryScanHistory
      parameters:
        - description: Only scans started at or after this time. Left out for no lower bound.
          explode: false
          in: query
          name: from
          schema:
            description: Only scans started at or after this time. Left out for no lower bound.
            format: date-time
            type: string
        - description: Only scans started at or before this time. Left out for no upper bound.
          explode: false
          in: query
          name: to
          schema:
            description: Only scans started at or before this time. Left out for no upper bound.
            format: date-time
            type: string
        - description: Page size.
          explode: false
          in: query
          name: limit
          schema:
            default: 100
            description: Page size.
            format: int64
            maximum: 500
            minimum: 1
            type: integer
        - description: How many scans to skip.
          explode: false
          in: query
          name: offset
          schema:
            description: How many scans to skip.
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanHistoryOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Past scans
      tags:
        - library
  /v1/library/scan/history/{id}:
    get:
      description: What one scan matched, grouped by title, and every file it looked at but could not match.
      operationId: getLibraryScanHistoryRun
      parameters:
        - description: Identifier of the scan run.
          in: path
          name: id
          required: true
          schema:
            description: Identifier of the scan run.
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanRunOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: One past scan
      tags:
        - library
  /v1/media/filter-options:
    get:
      description: The source's own vocabulary, kept for at most a day. Formats, statuses and seasons are fixed enums of searchMedia and are not repeated here.
      operationId: getMediaFilterOptions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilterOptionsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Genres and tags to filter by
      tags:
        - media
  /v1/media/search:
    get:
      description: "Asks the source that owns this kind of media, on demand and never in the background. Results are not stored: only a title the user opens is cached, and only for as long as the source's terms allow."
      operationId: searchMedia
      parameters:
        - description: Free text to match against every title the source knows. Empty browses by the filters alone.
          explode: false
          in: query
          name: q
          schema:
            description: Free text to match against every title the source knows. Empty browses by the filters alone.
            maxLength: 100
            type: string
        - description: Which catalog to search. Every source owns one kind of media, so this also picks the source.
          explode: false
          in: query
          name: type
          schema:
            default: anime
            description: Which catalog to search. Every source owns one kind of media, so this also picks the source.
            enum:
              - anime
              - manga
            type: string
        - description: Order of the results. Left out it means relevance while searching and popularity while browsing.
          explode: false
          in: query
          name: sort
          schema:
            description: Order of the results. Left out it means relevance while searching and popularity while browsing.
            enum:
              - SEARCH_MATCH
              - POPULARITY_DESC
              - TRENDING_DESC
              - SCORE_DESC
              - FAVOURITES_DESC
              - START_DATE_DESC
              - TITLE_ROMAJI
            type: string
        - description: Genres a title must all have, as listed by getMediaFilterOptions.
          explode: false
          in: query
          name: genres
          schema:
            description: Genres a title must all have, as listed by getMediaFilterOptions.
            items:
              type: string
            type:
              - array
              - "null"
        - description: Tags a title must all have, as listed by getMediaFilterOptions.
          explode: false
          in: query
          name: tags
          schema:
            description: Tags a title must all have, as listed by getMediaFilterOptions.
            items:
              type: string
            type:
              - array
              - "null"
        - description: Any of these formats.
          explode: false
          in: query
          name: formats
          schema:
            description: Any of these formats.
            items:
              enum:
                - TV
                - TV_SHORT
                - MOVIE
                - SPECIAL
                - OVA
                - ONA
                - MUSIC
                - MANGA
                - NOVEL
                - ONE_SHOT
              type: string
            type:
              - array
              - "null"
        - description: Any of these release statuses.
          explode: false
          in: query
          name: statuses
          schema:
            description: Any of these release statuses.
            items:
              enum:
                - FINISHED
                - RELEASING
                - NOT_YET_RELEASED
                - CANCELLED
                - HIATUS
              type: string
            type:
              - array
              - "null"
        - description: Season the title started in.
          explode: false
          in: query
          name: season
          schema:
            description: Season the title started in.
            enum:
              - WINTER
              - SPRING
              - SUMMER
              - FALL
            type: string
        - description: Year the title started in.
          explode: false
          in: query
          name: year
          schema:
            description: Year the title started in.
            format: int64
            maximum: 2100
            minimum: 1940
            type: integer
        - description: Keep titles scored above this, on a 0-100 scale.
          explode: false
          in: query
          name: min_score
          schema:
            description: Keep titles scored above this, on a 0-100 scale.
            format: int64
            maximum: 100
            minimum: 0
            type: integer
        - description: Include adult titles. They are left out unless this is set, and the source hides them entirely from a node with no account connected.
          explode: false
          in: query
          name: adult
          schema:
            description: Include adult titles. They are left out unless this is set, and the source hides them entirely from a node with no account connected.
            type: boolean
        - description: Which page of results to return.
          explode: false
          in: query
          name: page
          schema:
            default: 1
            description: Which page of results to return.
            format: int64
            minimum: 1
            type: integer
        - description: How many titles per page.
          explode: false
          in: query
          name: per_page
          schema:
            default: 30
            description: How many titles per page.
            format: int64
            maximum: 50
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Search titles
      tags:
        - media
  /v1/media/{media_ref}:
    get:
      description: Fetched from the source on demand and kept for at most a day, as the source's terms allow. Past that the node asks again; while the source is unreachable the request fails, and clients fall back to what the user's own list already knows about the title.
      operationId: getMediaDetails
      parameters:
        - description: The title's media reference.
          in: path
          name: media_ref
          required: true
          schema:
            description: The title's media reference.
            examples:
              - anilist:154587
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Title details
      tags:
        - media
  /v1/playback:
    delete:
      description: Ends the session. Whatever was already recorded as watched stays recorded.
      operationId: stopPlayback
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Close the player
      tags:
        - playback
    get:
      description: The node plays one file at a time. Position and duration come from the player itself and arrive as playback events on the socket; this is the state to start from.
      operationId: getPlayback
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: What is playing
      tags:
        - playback
    post:
      description: Opens the player on a scanned file. Starting a second file replaces the first — the node keeps one window. A matched file is marked watched once it is far enough through, and the tracker decides what that means for the user's list.
      operationId: startPlayback
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Play a library file
      tags:
        - playback
  /v1/playback/command:
    post:
      description: "Pause, resume or jump. Deliberately small: the player's own window is in front of the user, and duplicating its controls would only add ways for the two to disagree."
      operationId: controlPlayback
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Steer the open player
      tags:
        - playback
  /v1/reader/status:
    get:
      description: Reports whether the reader module is wired. Placeholder for phase 0.
      operationId: getReaderStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOutputBody1"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Reader module status
      tags:
        - reader
  /v1/sync/status:
    get:
      description: Reports whether the sync module is wired. Placeholder for phase 0.
      operationId: getSyncStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOutputBody2"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Sync module status
      tags:
        - sync
  /v1/torrent/status:
    get:
      description: Reports whether the torrent module is wired. Placeholder for phase 0.
      operationId: getTorrentStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Torrent module status
      tags:
        - torrent
  /v1/tracker/entries:
    get:
      description: Served from the node's mirror, so it works offline. A stale mirror is returned immediately while a refresh runs; a `tracker` event announces the result.
      operationId: listTrackerEntries
      parameters:
        - description: Which collection to read.
          explode: false
          in: query
          name: type
          required: true
          schema:
            description: Which collection to read.
            enum:
              - anime
              - manga
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntriesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Tracker entries
      tags:
        - tracker
  /v1/tracker/entries/{media_ref}:
    put:
      description: "Applies the change locally and queues it for AniList, so it works offline. The returned entry already carries the change with `sync_pending: true`; a `tracker` event with reason `synced` follows once AniList has it. A progress lower than what AniList already holds is only sent when it is lower than what the user saw — so an older offline edit never rolls back progress made on another device."
      operationId: updateTrackerEntry
      parameters:
        - description: The entry's media reference, as returned by listTrackerEntries.
          in: path
          name: media_ref
          required: true
          schema:
            description: The entry's media reference, as returned by listTrackerEntries.
            examples:
              - anilist:154587
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEntryInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a tracker entry
      tags:
        - tracker
  /v1/tracker/lists:
    get:
      description: Every list the user made, in one response. Anime and manga lists are read from the node's AniList mirror, so they work offline; the other media types are the node's own. Status lists are not included — those are an entry's status, not a list.
      operationId: listTrackerLists
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Custom lists
      tags:
        - tracker
    post:
      description: An anime or manga list is created in the user's AniList account and needs AniList reachable; the other media types are stored in this node and work offline.
      operationId: createTrackerList
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomList"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a custom list
      tags:
        - tracker
  /v1/tracker/lists/{id}:
    delete:
      description: Removes the list. Titles in it keep their entry and their status; they only lose this list's label.
      operationId: deleteTrackerList
      parameters:
        - description: The list's identifier, as returned by listTrackerLists.
          in: path
          name: id
          required: true
          schema:
            description: The list's identifier, as returned by listTrackerLists.
            examples:
              - anilist:anime:Rewatch
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a custom list
      tags:
        - tracker
    patch:
      operationId: renameTrackerList
      parameters:
        - description: The list's identifier, as returned by listTrackerLists.
          in: path
          name: id
          required: true
          schema:
            description: The list's identifier, as returned by listTrackerLists.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameListInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Rename a custom list
      tags:
        - tracker
  /v1/tracker/refresh:
    post:
      description: Starts a background refresh; the result arrives as a `tracker` event.
      operationId: refreshTrackerEntries
      parameters:
        - description: Which collection to read.
          explode: false
          in: query
          name: type
          required: true
          schema:
            description: Which collection to read.
            enum:
              - anime
              - manga
            type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedOutputBody"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Refresh tracker entries
      tags:
        - tracker
security:
  - nodeToken: []
tags:
  - description: Liveness and build information.
    name: health
  - description: Local file scanning and matching against catalog titles.
    name: library
  - description: Providers and download management.
    name: torrent
  - description: mpv control, direct play and transcoding.
    name: playback
  - description: Image-based and epub/pdf reading.
    name: reader
  - description: Progress synchronisation with a paired cloud account.
    name: sync
  - description: Plugin runtime for metadata and torrent providers.
    name: extension
