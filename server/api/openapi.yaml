          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UpdateExtensionInputBody.json
          format: uri
          readOnly: true
          type: string
        consent:
          description: From the update check the user saw.
          pattern: ^[0-9a-f]{64}$
          type: string
      required:
        - consent
      type: object
    UpdateRootInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UpdateRootInputBody.json
          format: uri
          readOnly: true
          type: string
        content:
          description: What the folder holds, as in listLibraryRoots. A folder turned to manga or books drops the files of other kinds.
          enum:
            - anime
            - movies_and_shows
            - doramas
            - manga
            - books
          type: string
      required:
        - content
      type: object
    Video:
      additionalProperties: false
      properties:
        bitrate:
          format: int32
          minimum: 0
          type: integer
        codec:
          type: string
        color_primaries:
          type: string
        color_space:
          type: string
        color_transfer:
          type: string
        height:
          format: int32
          minimum: 0
          type: integer
        language:
          type: string
        mime_codec:
          type: string
        pix_fmt:
          type: string
        quality:
          type: string
        width:
          format: int32
          minimum: 0
          type: integer
      required:
        - codec
        - quality
        - width
        - height
        - bitrate
        - pix_fmt
        - color_space
        - color_transfer
        - color_primaries
      type: object
  securitySchemes:
    nodeToken:
      description: The node's local token, generated on first start and read by the desktop shell.
      in: header
      name: X-Mediary-Node-Token
      type: apiKey
info:
  description: "Local API of a Mediary self-hosted node: library, downloads, playback, reader and cloud sync. Bound to loopback and gated by a local token."
  title: Mediary Node API
  version: 0.0.0-dev
openapi: 3.1.0
paths:
  /v1/ai/settings:
    get:
      description: Which AI fills in titles, whether it can answer now, and how each one is set up — the free AI's daily allowance, and for the others whether the user saved a key and which model answers. Keys are never returned.
      operationId: getAISettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISettings"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: AI connection
      tags:
        - media
    put:
      description: Chooses the AI that fills in titles and stores each provider's key once the provider has accepted it, in a file only the user can read, never in the database or a backup. A key a provider refuses is not stored and answers 428.
      operationId: setAISettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AISettingsUpdate"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISettings"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Set up the AI
      tags:
        - media
  /v1/anilist/session:
    delete:
      description: Forgets the token and deletes the mirrored collections.
      operationId: disconnectAniList
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Disconnect the AniList account
      tags:
        - tracker
    get:
      operationId: getAniListSession
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: AniList connection
      tags:
        - tracker
    put:
      description: Validates the token against AniList before storing it, then starts fetching both collections in the background.
      operationId: connectAniList
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Connect an AniList account
      tags:
        - tracker
  /v1/books/downloads:
    get:
      description: The queue and recent downloads, newest first. Changes arrive on the books.download topic.
      operationId: listBookDownloads
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDownloadsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Book downloads
      tags:
        - books
    post:
      description: Queues the copy into the folder for books, where it joins the library as the book given. A copy already queued or saved is left as it is; a failed one is queued again.
      operationId: enqueueBookDownload
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnqueueBookDownloadInputBody"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDownload"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Save a free copy of a book
      tags:
        - books
  /v1/books/downloads/settings:
    get:
      operationId: getBookDownloadSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDownloadSettings"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Where copies of books are saved
      tags:
        - books
    put:
      description: One of the library folders of books, so a saved copy is part of the library at once.
      operationId: putBookDownloadSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutBookDownloadSettingsInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDownloadSettings"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Choose where copies of books are saved
      tags:
        - books
  /v1/books/downloads/{id}:
    delete:
      description: The saved file stays where it is.
      operationId: forgetBookDownload
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Remove a finished book download from the list
      tags:
        - books
  /v1/books/downloads/{id}/cancel:
    post:
      operationId: cancelBookDownload
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Stop a book download
      tags:
        - books
  /v1/books/downloads/{id}/retry:
    post:
      operationId: retryBookDownload
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Try a failed book download again
      tags:
        - books
  /v1/books/editions:
    get:
      description: Searches every source at once, by the book's title and authors or by the text given.
      operationId: searchBookEditions
      parameters:
        - description: The book to find copies of, by its title and authors.
          explode: false
          in: query
          name: media_ref
          schema:
            description: The book to find copies of, by its title and authors.
            maxLength: 200
            type: string
        - description: Text to search for, in place of or beside media_ref.
          explode: false
          in: query
          name: q
          schema:
            description: Text to search for, in place of or beside media_ref.
            maxLength: 500
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchBookEditionsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Find free copies of a book
      tags:
        - books
  /v1/books/opds/check:
    post:
      description: Reads the catalogue and runs a search in it, before or after the server is saved.
      operationId: checkBookOPDSServer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckBookOPDSServerInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckBookOPDSServerOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Try an OPDS server of books
      tags:
        - books
  /v1/books/opds/servers:
    get:
      description: The user's own catalogues of books — Calibre-Web, Kavita — and Standard Ebooks for its patrons. Each is searched beside Project Gutenberg.
      operationId: listBookOPDSServers
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookOPDSServersOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: OPDS servers of books
      tags:
        - books
    post:
      operationId: createBookOPDSServer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookOPDSServerInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookOPDSServerOutputBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Add an OPDS server of books
      tags:
        - books
  /v1/books/opds/servers/{id}:
    delete:
      description: Books saved from it stay in the library.
      operationId: deleteBookOPDSServer
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Remove an OPDS server of books
      tags:
        - books
    put:
      operationId: updateBookOPDSServer
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookOPDSServerInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookOPDSServerOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Change an OPDS server of books
      tags:
        - books
  /v1/books/sources:
    get:
      operationId: listBookSources
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookSourcesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Sources of free copies of books
      tags:
        - books
  /v1/books/sources/gutenberg:
    get:
      operationId: getGutenbergSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GutenbergSettingsBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Project Gutenberg as a source of books
      tags:
        - books
    put:
      description: "On, the node downloads Gutenberg's catalogue and searches it locally: the site is asked only for a book the user downloads. Off removes the catalogue."
      operationId: putGutenbergSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutGutenbergSettingsInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GutenbergSettingsBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Turn Project Gutenberg on or off
      tags:
        - books
  /v1/books/sources/gutenberg/refresh:
    post:
      operationId: refreshGutenbergCatalog
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GutenbergSettingsBody"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Check for a newer Project Gutenberg catalogue now
      tags:
        - books
  /v1/extension/status:
    get:
      operationId: getExtensionStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Extension module status
      tags:
        - extension
  /v1/extensions:
    get:
      description: Each with the hosts it may reach, its settings — secrets only as set or not — and what the last update check found. Changes arrive on the extension topic.
      operationId: listExtensions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Installed plugins
      tags:
        - extension
    post:
      description: Reads the manifest again and installs it only if it is the one the consent was given for. The code is downloaded once, refused unless it matches the manifest's sum, and run only from the saved copy.
      operationId: installExtension
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallExtensionInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Extension"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Install a plugin
      tags:
        - extension
  /v1/extensions/catalog:
    get:
      description: What a repository says about a plugin is shown as it says it; installing previews the plugin's own manifest and asks for consent to that. Reads are reused for an hour. A repository that fails keeps the plugins of its last good read, with the error beside it. There is no repository until the user adds one.
      operationId: getExtensionCatalog
      parameters:
        - description: Read every repository again instead of reusing reads under an hour old.
          explode: false
          in: query
          name: refresh
          schema:
            description: Read every repository again instead of reusing reads under an hour old.
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionCatalog"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Plugins the user's repositories offer
      tags:
        - extension
  /v1/extensions/preview:
    post:
      description: "Reads the manifest and says what installing it means: the hosts the plugin will reach and the settings it asks for. Nothing is downloaded but the manifest, nothing is saved. Install with the consent it returns."
      operationId: previewExtension
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewExtensionInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionPreview"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Read a plugin before installing it
      tags:
        - extension
  /v1/extensions/repositories:
    post:
      description: "Read first: an address that is not a repository is refused rather than saved."
      operationId: addExtensionRepository
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddRepositoryInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionRepository"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Add a plugin repository
      tags:
        - extension
  /v1/extensions/repositories/{id}:
    delete:
      description: Plugins installed from it stay installed and keep updating from their own addresses.
      operationId: removeExtensionRepository
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Remove a plugin repository
      tags:
        - extension
  /v1/extensions/updates:
    post:
      description: Reads each plugin's manifest at the address it was installed from. Nothing is installed. A newer version that reaches new hosts or plays another role needs the user's consent again.
      operationId: checkExtensionUpdates
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Look for newer versions of the plugins
      tags:
        - extension
  /v1/extensions/{id}:
    delete:
      description: Its code, settings and secrets go with it.
      operationId: removeExtension
      parameters:
        - in: path
          name: id
          required: true
          schema:
            pattern: ^[a-z][a-z0-9-]{1,47}$
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Remove a plugin
      tags:
        - extension
    patch:
      operationId: configureExtension
      parameters:
        - in: path
          name: id
          required: true
          schema:
            pattern: ^[a-z][a-z0-9-]{1,47}$
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigureExtensionInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Extension"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Turn a plugin on or off, or change its settings
      tags:
        - extension
  /v1/extensions/{id}/update:
    post:
      description: Only from the address it was installed from, only newer, only the manifest the consent was given for. Settings that still fit carry over.
      operationId: updateExtension
      parameters:
        - in: path
          name: id
          required: true
          schema:
            pattern: ^[a-z][a-z0-9-]{1,47}$
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExtensionInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Extension"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Install a plugin's newer version
      tags:
        - extension
  /v1/google-books/settings:
    get:
      description: Whether books Open Library does not know can be looked up on Google Books, and with whose key. The key itself is never returned.
      operationId: getGoogleBooksSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleBooksSettings"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Google Books connection
      tags:
        - media
    put:
      description: Checks the key with Google, then keeps it in a file only the user can read, never in the database or a backup. A key Google refuses is not stored and answers 428.
      operationId: setGoogleBooksKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleBooksKeyInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleBooksSettings"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Use your own Google Books key
      tags:
        - media
  /v1/health:
    get:
      description: Reports liveness, the running build and whether a cloud account is paired.
      operationId: getNodeHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Node health
      tags:
        - health
  /v1/library/collection:
    get:
      description: "Every title the library holds files of, by name, with how many files each has. This is what the library shelf is drawn from: grouping a page of files into titles on the client would both cost a page of files and miss everything past it."
      operationId: getLibraryCollection
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: The library as titles
      tags:
        - library
  /v1/library/files:
    get:
      description: Files the last scan recorded, with the title each was matched to. A file the scan no longer finds is kept and reported as missing, so an unplugged drive does not take the user's manual matches with it.
      operationId: listLibraryFiles
      parameters:
        - description: Only files under this root.
          explode: false
          in: query
          name: root_id
          schema:
            description: Only files under this root.
            format: int64
            type: integer
        - description: Only files whose extension points at this form of media.
          explode: false
          in: query
          name: kind
          schema:
            description: Only files whose extension points at this form of media.
            enum:
              - video
              - manga
              - book
            type: string
        - description: Only files whose name reads as this. Use it to leave out openings and extras, which are never episodes.
          explode: false
          in: query
          name: form
          schema:
            description: Only files whose name reads as this. Use it to leave out openings and extras, which are never episodes.
            enum:
              - series
              - movie
              - special
              - extra
              - manga
              - book
            type: string
        - description: Only files that still need a title. Files the user set aside are left out — they are asking for nothing.
          explode: false
          in: query
          name: unmatched
          schema:
            description: Only files that still need a title. Files the user set aside are left out — they are asking for nothing.
            type: boolean
        - description: Only files the user told the node to leave alone.
          explode: false
          in: query
          name: ignored
          schema:
            description: Only files the user told the node to leave alone.
            type: boolean
        - description: Only files matched to this title — the episodes a title page lists.
          explode: false
          in: query
          name: media_ref
          schema:
            description: Only files matched to this title — the episodes a title page lists.
            examples:
              - anilist:154587
            type: string
        - description: Page size.
          explode: false
          in: query
          name: limit
          schema:
            default: 100
            description: Page size.
            format: int64
            maximum: 500
            minimum: 1
            type: integer
        - description: How many files to skip.
          explode: false
          in: query
          name: offset
          schema:
            description: How many files to skip.
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Scanned files
      tags:
        - library
  /v1/library/files/tree:
    get:
      description: The whole library in one read, for a view that draws all of it at once. A tree is every file by definition, so paging it would only mean asking page after page before anything can be drawn.
      operationId: listAllLibraryFiles
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Every scanned file
      tags:
        - library
  /v1/library/files/{id}:
    delete:
      description: Removes the file from disk and then from the library. A file the node could not delete keeps its row, so nothing is quietly forgotten while it is still there.
      operationId: deleteLibraryFile
      parameters:
        - description: Identifier of the file to delete.
          in: path
          name: id
          required: true
          schema:
            description: Identifier of the file to delete.
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a file
      tags:
        - library
  /v1/library/files/{id}/candidates:
    get:
      description: "Titles the file's name could refer to, best first, each with how well it fits. This is the other half of the automatic match: what the node would not decide on its own it offers here, for the user to confirm with setLibraryFileMatch. Entries already on the user's own list are marked and come from the node's mirror, so they are offered even while the source is unreachable."
      operationId: listLibraryFileCandidates
      parameters:
        - description: Identifier of the file to find candidates for.
          in: path
          name: id
          required: true
          schema:
            description: Identifier of the file to find candidates for.
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestionsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: What this file could be
      tags:
        - library
  /v1/library/files/{id}/ignore:
    put:
      description: Sets a file aside so no scan offers it for matching again. A sample, a trailer the parser could not place, a file that belongs to nothing — without this it comes back as unmatched after every scan and the count never reaches zero. Nothing on disk is touched.
      operationId: setLibraryFileIgnored
      parameters:
        - description: Identifier of the file to set aside.
          in: path
          name: id
          required: true
          schema:
            description: Identifier of the file to set aside.
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetIgnoredInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Leave a file alone
      tags:
        - library
  /v1/library/files/{id}/match:
    delete:
      description: Leaves the file unmatched so the next scan can work it out again.
      operationId: deleteLibraryFileMatch
      parameters:
        - description: Identifier of the file whose match to forget.
          in: path
          name: id
          required: true
          schema:
            description: Identifier of the file whose match to forget.
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Forget a file's match
      tags:
        - library
    put:
      description: Ties the file to a title the user picked. A manual match outranks anything a later scan works out on its own, so a correction is made once and not after every scan.
      operationId: setLibraryFileMatch
      parameters:
        - description: Identifier of the file to match.
          in: path
          name: id
          required: true
          schema:
            description: Identifier of the file to match.
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMatchInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Match a file by hand
      tags:
        - library
  /v1/library/roots:
    get:
      description: The folders the node scans, with how many files each holds and when it was last walked.
      operationId: listLibraryRoots
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Library folders
      tags:
        - library
    post:
      description: The folder has to exist and must not sit inside — or contain — a folder already watched, which would record the same file twice.
      operationId: addLibraryRoot
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddRootInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootOutputBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Add a library folder
      tags:
        - library
  /v1/library/roots/{id}:
    delete:
      description: Forgets the folder and everything the node recorded about the files in it, including their matches. Nothing on disk is touched.
      operationId: deleteLibraryRoot
      parameters:
        - description: Identifier of the root to stop watching.
          in: path
          name: id
          required: true
          schema:
            description: Identifier of the root to stop watching.
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Stop watching a folder
      tags:
        - library
    patch:
      description: Switching between anime and movies and shows drops the automatic matches of the folder's videos — they point at the other source — and scans it again to redo them. Matches the user made by hand stay.
      operationId: updateLibraryRoot
      parameters:
        - description: Identifier of the root.
          in: path
          name: id
          required: true
          schema:
            description: Identifier of the root.
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRootInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Say what a library folder holds
      tags:
        - library
  /v1/library/scan:
    get:
      description: What the running scan has found so far, or the outcome of the last one.
      operationId: getLibraryScan
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Scan status
      tags:
        - library
    post:
      description: "Starts a scan and returns at once: walking a large library takes minutes. Progress arrives as library.scan events on the socket. Only one scan runs at a time. Files whose size and modification time did not change are not touched, so a rescan is cheap, and a folder that cannot be read right now is skipped rather than emptied."
      operationId: startLibraryScan
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanInputBody"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanOutputBody"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Scan the library
      tags:
        - library
  /v1/library/scan/history:
    get:
      description: Every scan the node has run, newest first, kept independently of the single current-scan slot so a scan from days ago is still readable.
      operationId: listLibraryScanHistory
      parameters:
        - description: Only scans started at or after this time. Left out for no lower bound.
          explode: false
          in: query
          name: from
          schema:
            description: Only scans started at or after this time. Left out for no lower bound.
            format: date-time
            type: string
        - description: Only scans started at or before this time. Left out for no upper bound.
          explode: false
          in: query
          name: to
          schema:
            description: Only scans started at or before this time. Left out for no upper bound.
            format: date-time
            type: string
        - description: Page size.
          explode: false
          in: query
          name: limit
          schema:
            default: 100
            description: Page size.
            format: int64
            maximum: 500
            minimum: 1
            type: integer
        - description: How many scans to skip.
          explode: false
          in: query
          name: offset
          schema:
            description: How many scans to skip.
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanHistoryOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Past scans
      tags:
        - library
  /v1/library/scan/history/{id}:
    get:
      description: What one scan matched, grouped by title, and every file it looked at but could not match.
      operationId: getLibraryScanHistoryRun
      parameters:
        - description: Identifier of the scan run.
          in: path
          name: id
          required: true
          schema:
            description: Identifier of the scan run.
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanRunOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: One past scan
      tags:
        - library
  /v1/manga/downloads:
