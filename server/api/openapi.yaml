              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Sources of chapters
      tags:
        - manga
  /v1/manga/sources/{source}/search:
    get:
      description: For linking a title to the series that holds its chapters.
      operationId: searchMangaSource
      parameters:
        - in: path
          name: source
          required: true
          schema:
            examples:
              - opds:3
            type: string
        - explode: false
          in: query
          name: q
          schema:
            maxLength: 200
            minLength: 1
            type: string
        - description: The title being linked, so a source that knows it can put its series first.
          explode: false
          in: query
          name: media_ref
          schema:
            description: The title being linked, so a source that knows it can put its series first.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MangaSearchOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Find a series in a source
      tags:
        - manga
  /v1/manga/titles/{mediaRef}/chapters:
    get:
      description: Every chapter the linked series hold, in chapter order. Chapters in the library are listed by the library, not here.
      operationId: listMangaChapters
      parameters:
