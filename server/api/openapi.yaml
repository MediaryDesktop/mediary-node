components:
  schemas:
    AcceptedOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AcceptedOutputBody.json
          format: uri
          readOnly: true
          type: string
        accepted:
          description: The refresh was started or is already running.
          type: boolean
      required:
        - accepted
      type: object
    Account:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Account.json
          format: uri
          readOnly: true
          type: string
        avatar_url:
          type:
            - string
            - "null"
        display_adult_content:
          type: boolean
        id:
          format: int64
          type: integer
        name:
          type: string
        score_format:
          type: string
        site_url:
          type: string
      required:
        - id
        - name
        - site_url
        - avatar_url
        - score_format
        - display_adult_content
      type: object
    AddRootInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AddRootInputBody.json
          format: uri
          readOnly: true
          type: string
        path:
          description: Absolute path to an existing folder on this machine.
          examples:
            - D:\Anime
          maxLength: 4096
          minLength: 1
          type: string
      required:
        - path
      type: object
    AddTorrentDownloadInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AddTorrentDownloadInputBody.json
          format: uri
          readOnly: true
          type: string
        choose_files:
          description: Hold the torrent in the client until its files are chosen with PUT .../files.
          type: boolean
        magnet:
          description: A magnet link with a BitTorrent v1 hash. Give this or torrent.
          maxLength: 65536
          type: string
        media_ref:
          description: The title the download is for; its files are matched to it.
          minLength: 1
          type: string
        release_id:
          description: A search result to download. Give this, magnet or torrent.
          maxLength: 100
          type: string
        title:
          description: The title's name, which names the folder the torrent is saved into.
          maxLength: 500
          type: string
        torrent:
          contentEncoding: base64
          description: A .torrent file, base64-encoded. Give this or magnet.
          type: string
      required:
        - media_ref
      type: object
    AiringEpisode:
      additionalProperties: false
      properties:
        airing_at:
          format: date-time
          type: string
        episode:
          format: int64
          type: integer
      required:
        - episode
        - airing_at
      type: object
    Audio:
      additionalProperties: false
      properties:
        channels:
          format: int32
          minimum: 0
          type: integer
        codec:
          type: string
        index:
          format: int32
          minimum: 0
          type: integer
        is_default:
          type: boolean
        is_forced:
          type: boolean
        language:
          type: string
        mime_codec:
          type: string
        title:
          type: string
      required:
        - index
        - codec
        - is_default
        - is_forced
        - channels
      type: object
    Chapter:
      additionalProperties: false
      properties:
        end_time:
          format: float
          type: number
        name:
          type: string
        start_time:
          format: float
          type: number
      required:
        - start_time
        - end_time
        - name
      type: object
    ChapterBody:
      additionalProperties: false
      properties:
        file_id:
          description: Library file this chapter is. Absent for a chapter from any other source.
          format: int64
          type: integer
        groups:
          description: Who translated it, to credit them.
          items:
            type: string
          type:
            - array
            - "null"
        media_ref:
          description: Title this chapter is matched to. Absent while unmatched.
          type: string
        number:
          description: Chapter number as the source writes it, such as 12 or 12.5. Absent for an unnumbered chapter.
          type: string
        pages:
          description: Every page, in reading order.
          items:
            $ref: "#/components/schemas/Page"
          type:
            - array
            - "null"
        ref:
          description: Chapter reference, for the page and progress endpoints.
          type: string
        source_name:
          description: Where an online chapter comes from, to credit it.
          type: string
        title:
          description: Title as the source names it, for the UI.
          type: string
      required:
        - ref
        - title
        - pages
      type: object
    ChapterOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ChapterOutputBody.json
          format: uri
          readOnly: true
          type: string
        chapter:
          $ref: "#/components/schemas/ChapterBody"
      required:
        - chapter
      type: object
    CheckOPDSServerInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CheckOPDSServerInputBody.json
          format: uri
          readOnly: true
          type: string
        password:
          type: string
        server_id:
          description: A saved server, whose stored password is used when none is given.
          format: int64
          type: integer
        url:
          type: string
        username:
          type: string
      required:
        - url
      type: object
    CheckOPDSServerOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CheckOPDSServerOutputBody.json
          format: uri
          readOnly: true
          type: string
        detail:
          type: string
        ok:
          type: boolean
        problem:
          description: What is wrong, when something is.
          enum:
            - unauthorized
            - not_opds
            - unreachable
            - other_host
          type: string
      required:
        - ok
      type: object
    CheckTorrentClientInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CheckTorrentClientInputBody.json
          format: uri
          readOnly: true
          type: string
        password:
          description: Left out uses the saved password.
          maxLength: 1024
          type: string
        url:
          maxLength: 2048
          minLength: 1
          type: string
        username:
          maxLength: 256
          type: string
      required:
        - url
        - username
      type: object
    CheckTorrentSourceInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CheckTorrentSourceInputBody.json
          format: uri
          readOnly: true
          type: string
        api_key:
          maxLength: 256
          type: string
        source_id:
          description: A saved source whose key to use when api_key is left out.
          format: int64
          type: integer
        url:
          maxLength: 2048
          minLength: 1
          type: string
      required:
        - url
      type: object
    CollectionOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CollectionOutputBody.json
          format: uri
          readOnly: true
          type: string
        collection:
          $ref: "#/components/schemas/LibraryCollection"
          description: The library seen as titles rather than as files.
        sources:
          description: Attribution for every field that came from an external source.
          items:
            $ref: "#/components/schemas/Source"
          type:
            - array
            - "null"
      required:
        - collection
        - sources
      type: object
    ControlInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ControlInputBody.json
          format: uri
          readOnly: true
          type: string
        action:
          description: What to do with the open player.
          enum:
            - pause
            - resume
            - seek
          type: string
        position:
          description: Seconds from the start, for a seek.
          format: double
          minimum: 0
          type: number
      required:
        - action
      type: object
    Counts:
      additionalProperties: false
      properties:
        ignored:
          description: Of those, files the user told the node to leave alone.
          format: int64
          type: integer
        missing:
          description: Of those, files the last scan did not find.
          format: int64
          type: integer
        total:
          description: Files the filter matches.
          format: int64
          type: integer
        unmatched:
          description: Of those, files that belong to no title yet.
          format: int64
          type: integer
      required:
        - total
        - unmatched
        - missing
        - ignored
      type: object
    CreateListInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateListInputBody.json
          format: uri
          readOnly: true
          type: string
        icon:
          description: Icon for the list, by name from the client's icon set. Leave it out for the default.
          maxLength: 40
          type: string
        media_type:
          description: "The one media type this list holds. A list never mixes types: anime and manga lists are created in the user's AniList account, the rest in this node."
          enum:
            - anime
            - manga
            - movie
            - series
            - dorama
            - book
          type: string
        name:
          description: What to call the list.
          maxLength: 100
          minLength: 1
          type: string
      required:
        - media_type
        - name
      type: object
    CustomList:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CustomList.json
          format: uri
          readOnly: true
          type: string
        count:
          description: How many titles are in the list.
          format: int64
          type: integer
        covers:
          description: Up to four cover images, for the list's thumbnail.
          items:
            type: string
          type:
            - array
            - "null"
        icon:
          description: Icon the user chose, by name. Absent means the default; a name the client does not know means the default too.
          type: string
        id:
          description: Opaque identifier; pass it back URL-encoded to rename or delete the list.
          type: string
        media_type:
          description: The one media type this list holds.
          enum:
            - anime
            - manga
            - movie
            - series
            - dorama
            - book
          type: string
        name:
          type: string
        provider:
          description: "Where the list lives: anilist or local."
          enum:
            - anilist
            - local
          type: string
        updated_at:
          description: When a title in the list last changed. Absent for an empty list.
          format: date-time
          type: string
      required:
        - id
        - provider
        - media_type
        - name
        - count
        - covers
      type: object
    Date:
      additionalProperties: false
      properties:
        day:
          format: int64
          type:
            - integer
            - "null"
        month:
          format: int64
          type:
            - integer
            - "null"
        year:
          format: int64
          type:
            - integer
            - "null"
      required:
        - year
        - month
        - day
      type: object
    DetailsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DetailsOutputBody.json
          format: uri
          readOnly: true
          type: string
        media:
          $ref: "#/components/schemas/MediaDetails"
          description: Everything a title page shows about the title itself.
        sources:
          description: Attribution for every field that came from an external source.
          items:
            $ref: "#/components/schemas/Source"
          type:
            - array
            - "null"
      required:
        - media
        - sources
      type: object
    EnqueueMangaDownloadsInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/EnqueueMangaDownloadsInputBody.json
          format: uri
          readOnly: true
          type: string
        refs:
          description: Chapter references, as the chapter listing gives them.
          items:
            type: string
          maxItems: 500
          minItems: 1
          type:
            - array
            - "null"
      required:
        - refs
      type: object
    EntriesOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/EntriesOutputBody.json
          format: uri
          readOnly: true
          type: string
        entries:
          description: One entry per title, in AniList's list order.
          items:
            $ref: "#/components/schemas/Entry"
          type:
            - array
            - "null"
        fetched_at:
          description: When AniList last answered for this collection.
          format: date-time
          type: string
        lists:
          description: Status and custom lists with their sizes.
          items:
            $ref: "#/components/schemas/List"
          type:
            - array
            - "null"
        media_type:
          description: The collection this response describes.
          type: string
        sources:
          description: Attribution for every field that came from an external source.
          items:
            $ref: "#/components/schemas/Source"
          type:
            - array
            - "null"
        stale:
          description: True when the data is older than the refresh interval; a refresh is already running.
          type: boolean
      required:
        - media_type
        - entries
        - lists
        - fetched_at
        - stale
        - sources
      type: object
    Entry:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Entry.json
          format: uri
          readOnly: true
          type: string
        completed_at:
          $ref: "#/components/schemas/Date"
        custom_lists:
          items:
            type: string
          type:
            - array
            - "null"
        media:
          $ref: "#/components/schemas/Media"
        media_ref:
          type: string
        media_type:
          type: string
        notes:
          type: string
        private:
          type: boolean
        progress:
          format: int64
          type: integer
        progress_volumes:
          format: int64
          type:
            - integer
            - "null"
        provider:
          type: string
        repeat:
          format: int64
          type: integer
        score:
          format: int64
          type: integer
        started_at:
          $ref: "#/components/schemas/Date"
        status:
          type: string
        sync_pending:
          type: boolean
        updated_at:
          format: date-time
          type: string
      required:
        - media_ref
        - provider
        - media_type
        - status
        - score
        - progress
        - progress_volumes
        - repeat
        - private
        - notes
        - started_at
        - completed_at
        - updated_at
        - custom_lists
        - sync_pending
        - media
      type: object
    Episode:
      additionalProperties: false
      properties:
        air_date:
          description: First broadcast, as YYYY-MM-DD.
          type:
            - string
            - "null"
        image:
          description: Still for the episode. Absent when no source has one; a client with the file can cut its own from it.
          type:
            - string
            - "null"
        number:
          description: Episode number within the title, from 1.
          format: int64
          type: integer
        overview:
          description: Synopsis, in English.
          type:
            - string
            - "null"
        runtime_minutes:
          description: Length in minutes, from the episode or, failing that, the title's typical length.
          format: int64
          type:
            - integer
            - "null"
        title:
          description: Episode title in the first language a source had it in, English first.
          type:
            - string
            - "null"
        titles:
          additionalProperties:
            type: string
          description: The title per language, keyed by BCP 47 tag (x-jat is romanised Japanese), for the client to pick the user's own.
          type: object
      required:
        - number
        - title
        - overview
        - image
        - runtime_minutes
        - air_date
      type: object
    EpisodeList:
      additionalProperties: false
      properties:
        episodes:
          description: One entry per episode, in order, whether or not anything is known about it beyond its number.
          items:
            $ref: "#/components/schemas/Episode"
          type:
            - array
            - "null"
        media_ref:
          description: The title, as provider:id.
          type: string
        total:
          description: Episodes the title has, or that have aired while the final count is unknown. Absent when no source can say.
          format: int64
          type:
            - integer
            - "null"
      required:
        - media_ref
        - total
        - episodes
      type: object
    Episodes:
      additionalProperties: false
      properties:
        from:
          format: int64
          type: integer
        to:
          format: int64
          type: integer
      required:
        - from
        - to
      type: object
    EpisodesOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/EpisodesOutputBody.json
          format: uri
          readOnly: true
          type: string
        episodes:
          $ref: "#/components/schemas/EpisodeList"
          description: The title's episodes with whatever the sources know of each.
        sources:
          description: Attribution for every field that came from an external source.
          items:
            $ref: "#/components/schemas/Source"
          type:
            - array
            - "null"
      required:
        - episodes
        - sources
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    File:
      additionalProperties: false
      properties:
        duration_seconds:
          description: How long the file runs, read out of its container during the scan. Absent for a container the node cannot read and for everything that is not video.
          format: int64
          type: integer
        id:
          description: Identifier of the file, stable while its path does not change.
          format: int64
          type: integer
        ignored:
          description: True when the user told the node to leave this file alone. An ignored file is never offered to the matcher again.
          type: boolean
        kind:
          description: Form of media the extension points at.
          enum:
            - video
            - manga
            - book
          type: string
        match:
          $ref: "#/components/schemas/Match"
          description: What the file was matched to. Absent while unmatched.
        missing:
          description: True when the last scan did not find the file where it used to be.
          type: boolean
        modified_at:
          description: Modification time the last scan saw.
          format: date-time
          type: string
        parsed:
          $ref: "#/components/schemas/Parsed"
          description: What the file's name says. Present whether or not the file is matched.
        path:
          description: Absolute path, for the player and for revealing the file.
          type: string
        rel_path:
          description: Path relative to the root, with forward slashes.
          type: string
        root_id:
          description: Root the file was found under.
          format: int64
          type: integer
        size_bytes:
          description: Size on disk.
          format: int64
          type: integer
      required:
        - id
        - root_id
        - path
        - rel_path
        - kind
        - size_bytes
        - modified_at
        - missing
        - ignored
        - parsed
      type: object
    FileOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/FileOutputBody.json
          format: uri
          readOnly: true
          type: string
        file:
          $ref: "#/components/schemas/File"
          description: The file with its match applied.
      required:
        - file
      type: object
    FilePage:
      additionalProperties: false
      properties:
        counts:
          $ref: "#/components/schemas/Counts"
          description: Totals for the whole library behind the filters over the list.
        items:
          description: One page of files.
          items:
            $ref: "#/components/schemas/File"
          type:
            - array
            - "null"
        limit:
          description: Page size that was applied.
          format: int64
          type: integer
        offset:
          description: Offset that was applied.
          format: int64
          type: integer
        titles:
          description: Every title the files on this page are matched to, once each.
          items:
            $ref: "#/components/schemas/MatchedTitle"
          type:
            - array
            - "null"
        total:
          description: How many files match the filter in total.
          format: int64
          type: integer
      required:
        - items
        - total
        - limit
        - offset
        - counts
        - titles
      type: object
    FilesOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/FilesOutputBody.json
          format: uri
          readOnly: true
          type: string
        files:
          $ref: "#/components/schemas/FilePage"
          description: One page of scanned files with their matches.
      required:
        - files
      type: object
    FilterOptions:
      additionalProperties: false
      properties:
        fetched_at:
          format: date-time
          type: string
        genres:
          items:
            type: string
          type:
            - array
            - "null"
        tags:
          items:
            $ref: "#/components/schemas/FilterTag"
          type:
            - array
            - "null"
      required:
        - genres
        - tags
        - fetched_at
      type: object
    FilterOptionsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/FilterOptionsOutputBody.json
          format: uri
          readOnly: true
          type: string
        options:
          $ref: "#/components/schemas/FilterOptions"
          description: The vocabulary the filter panel offers.
        sources:
          description: Attribution for every field that came from an external source.
          items:
            $ref: "#/components/schemas/Source"
          type:
            - array
            - "null"
      required:
        - options
        - sources
      type: object
    FilterTag:
      additionalProperties: false
      properties:
        category:
          type: string
        is_adult:
          type: boolean
        name:
          type: string
      required:
        - name
        - category
        - is_adult
      type: object
    Font:
      additionalProperties: false
      properties:
        index:
          format: int32
          minimum: 0
          type: integer
        name:
          type: string
      required:
        - index
        - name
      type: object
    FuzzyDate:
      additionalProperties: false
      properties:
        day:
          format: int64
          type:
            - integer
            - "null"
        month:
          format: int64
          type:
            - integer
            - "null"
        year:
          format: int64
          type:
            - integer
            - "null"
      required:
        - year
        - month
        - day
      type: object
    HealthOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/HealthOutputBody.json
          format: uri
          readOnly: true
          type: string
        built:
          description: Build timestamp.
          examples:
