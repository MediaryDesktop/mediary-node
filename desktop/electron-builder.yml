appId: org.mediary.desktop
productName: Mediary
copyright: Copyright © 2026 Mediary
icon: resources/icon.png

directories:
  output: release
  buildResources: resources

files:
  - out/**
  - package.json

# The Go node binary is not a Node dependency — it is a separate executable
# built by `task build:all` in ../server and copied in here. It must land in
# resources/bin/, which is where NodeSupervisor looks when app.isPackaged.
extraResources:
  - from: ../server/bin
    to: bin
    filter:
      - mediary-node*
      - nodesrv*

# Electron's fuses, flipped in the packaged binary. Off, they would let anything
# on the machine run Mediary.exe as plain Node (ELECTRON_RUN_AS_NODE), inject
# code through NODE_OPTIONS, or attach a debugger with --inspect — all under the
# app's own name. The app is loaded only from its asar, and an asar that was
# tampered with is refused.
#
# grantFileProtocolExtraPrivileges stays on: the renderer is still loaded from
# file://, and its module scripts, the pdf.js worker and the subtitle wasm need
# those privileges until it moves to a custom protocol.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.entertainment
  # The node spawns child processes and opens local sockets; the hardened
  # runtime needs those entitlements declared explicitly.
  hardenedRuntime: true
  entitlementsInherit: resources/entitlements.mac.plist

linux:
  target:
    - AppImage
    - deb
  category: AudioVideo
  maintainer: Mediary

publish: null
