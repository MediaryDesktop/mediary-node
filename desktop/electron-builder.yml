appId: org.mediary.desktop
productName: Mediary
copyright: Copyright © 2026 Mediary
icon: resources/icon.png

directories:
  output: release
  buildResources: resources

# Everything the app runs is bundled by electron-vite into out/ (electron-updater
# too); a dependency in node_modules would only be dead weight in the asar.
files:
  - out/**
  - package.json
  - '!node_modules/**'

# The Go node binary is not a Node dependency — it is a separate executable
# built by `task build:all` in ../server. Each installer takes only the binary
# for its own platform and architecture and ships it as resources/bin/nodesrv,
# which is where NodeSupervisor looks when app.isPackaged. scripts/after-pack.cjs
# refuses an installer without it.
afterPack: scripts/after-pack.cjs

# Electron's fuses, flipped in the packaged binary. Off, they would let anything
# on the machine run Mediary.exe as plain Node (ELECTRON_RUN_AS_NODE), inject
# code through NODE_OPTIONS, or attach a debugger with --inspect — all under the
# app's own name. The app is loaded only from its asar, and an asar that was
# tampered with is refused. The renderer is served from app://- (see
# electron/main/app-protocol.ts), so file:// pages need no extra privileges.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
  grantFileProtocolExtraPrivileges: false

win:
  extraResources:
    - from: ../server/bin/nodesrv-win-${arch}.exe
      to: bin/nodesrv.exe
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

mac:
  extraResources:
    - from: ../server/bin/nodesrv-mac-${arch}
      to: bin/nodesrv
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.entertainment
  # The node spawns child processes and opens local sockets; the hardened
  # runtime needs those entitlements declared explicitly.
  hardenedRuntime: true
  entitlementsInherit: resources/entitlements.mac.plist

linux:
  extraResources:
    - from: ../server/bin/nodesrv-linux-${arch}
      to: bin/nodesrv
  target:
    - AppImage
    - deb
  category: AudioVideo
  maintainer: Mediary

# Unsigned for now (docs/audits/electron-shell.md, stage 5): Windows and Linux
# update themselves from these releases; macOS is told about a release and
# downloads it by hand, since Squirrel.Mac installs only signed apps.
publish:
  provider: github
  owner: MediaryDesktop
  repo: mediary-node
  releaseType: draft
