<!doctype html>
<html lang="uk">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!--
			The renderer is sandboxed and loads nothing remote. Declaring that in a
			CSP means a future dependency that tries to phone home fails loudly
			instead of quietly succeeding.
		-->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:* https:;"
		/>
		<title>Mediary</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="./app/main.tsx"></script>
	</body>
</html>
