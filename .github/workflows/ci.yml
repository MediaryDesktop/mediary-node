name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "24"

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5

      # TEMPORARY — remove once mediary-contracts publishes go/v0.1.0.
      #
      # server/internal/platform/cloud imports the generated cloud client, which
      # has no published version yet. Rather than commit a `replace` directive
      # (which would break every other checkout), CI reconstructs the same
      # go.work developers use locally. After the first contracts release this
      # whole step goes away and `go build` resolves the dependency normally.
      - name: Check out the contracts repository
        uses: actions/checkout@v5
        with:
          repository: mediaryorg/mediary-contracts
          path: .contracts

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: Link the unpublished contracts module
        run: |
          cd "$GITHUB_WORKSPACE"
          go work init ./server ./.contracts/go

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          working-directory: server
          args: --timeout=5m

      - name: Check formatting
        run: golangci-lint fmt --diff

      - name: Test
        run: go test -race -cover ./...

      - name: Build
        run: go build ./...

      - name: OpenAPI document is current
        run: |
          go run ./cmd/openapi api/openapi.yaml
          git diff --exit-code -- api/openapi.yaml

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # The generated API types are committed, so CI proves they still match the
      # specs they came from. A stale type file compiles happily against an API
      # that no longer exists.
      - name: Generated API types are current
        working-directory: desktop
        run: |
          npm run api:types:node
          git diff --exit-code -- src/shared/types/node.gen.ts

      - name: Format, architecture, types, tests
        working-directory: desktop
        run: npm run check

      - name: Build
        working-directory: desktop
        run: npm run build
