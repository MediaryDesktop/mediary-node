name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "24"

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          working-directory: server
          args: --timeout=5m

      - name: Check formatting
        run: golangci-lint fmt --diff

      - name: Test
        run: go test -race -cover ./...

      - name: Build
        run: go build ./...

      - name: OpenAPI document is current
        run: |
          go run ./cmd/openapi api/openapi.yaml
          git diff --exit-code -- api/openapi.yaml

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # The generated API types are committed, so CI proves they still match the
      # specs they came from. A stale type file compiles happily against an API
      # that no longer exists. Formatted the way the committed file is, or the
      # diff would only ever show Prettier's changes.
      #
      # The cloud's types and input limits come from mediary-contracts at the
      # commit server/go.mod pins, so the node and the UI of one release see the
      # same contract. The scripts read it from the workspace's sibling folder.
      - name: Check out the pinned contracts
        run: |
          version=$(grep -oE 'mediary-contracts/go v[^ ]+' server/go.mod | cut -d' ' -f2)
          case "$version" in
            v0.0.0-*) ref=${version##*-} ;;
            *) ref="go/$version" ;;
          esac
          git clone --quiet https://github.com/MediaryDesktop/mediary-contracts.git ../mediary-contracts
          git -C ../mediary-contracts checkout --quiet "$ref"

      - name: Generated API types are current
        working-directory: desktop
        run: |
          npm run api:types
          git diff --exit-code -- src/infrastructure/node/schema.gen.ts src/infrastructure/cloud/schema.gen.ts src/features/auth/validation/limits.gen.ts

      - name: Format, architecture, types, tests
        working-directory: desktop
        run: npm run check

      - name: Build
        working-directory: desktop
        run: npm run build
