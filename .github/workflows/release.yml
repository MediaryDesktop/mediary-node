name: release

# A tag vX.Y.Z builds every installer and attaches it, with the update metadata
# electron-updater reads, to a draft release. Publishing the draft is what ships
# it: installed apps see a release only once it is no longer a draft.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

env:
  GO_VERSION: '1.27'
  NODE_VERSION: '24'

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: The tag matches the app version
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match desktop/package.json version $version"
            exit 1
          fi

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.54.0

      - name: Cross-compile the node
        working-directory: server
        run: task build:all

      - uses: actions/upload-artifact@v4
        with:
          name: node-binaries
          path: server/bin/
          if-no-files-found: error

  desktop:
    needs: node
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: node-binaries
          path: server/bin/

      # Artifacts lose the executable bit.
      - name: Make the node executable
        if: runner.os != 'Windows'
        run: chmod +x server/bin/nodesrv-*

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build
        working-directory: desktop
        run: npm run build

      # No code signing yet (docs/audits/electron-shell.md, stage 5).
      - name: Package and upload to the draft release
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.target }} --publish always
